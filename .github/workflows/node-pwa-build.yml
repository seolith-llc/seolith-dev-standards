name: Reusable Node PWA Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24.16.0"
      project-path:
        required: false
        type: string
        default: "."
      build-command:
        required: false
        type: string
        default: "npm run build"
      output-path:
        required: false
        type: string
        default: "dist"
      runs-on:
        required: false
        type: string
        # Linux by default since 2026-07-30. The estate's 3 Windows runners
        # were the queue for every build while 3 WSL runners idled --
        # effective capacity was 3 of 7. This lane is pure Node and has no
        # Windows dependency; proven green on Linux in seolith-hindi-buddy#14
        # (node-build) and seolith-box-breathing#4 (node-pwa-build).
        #
        # 'node-capable', NOT 'linux-build': EWA-NUC-KRK-LINUX carries
        # linux-build but is a WSL 1 host whose Node install does not resolve,
        # so every npx there dies instantly. Callers needing Windows can still
        # override this input.
        default: '["self-hosted","Linux","X64","seolith-local","node-capable"]'
      audit-level:
        required: false
        type: string
        default: "high"

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 25
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@v5

      - name: Run AgentShield Security Scan
        run: npx --yes ecc-agentshield@1.4.0 scan --path "${{ github.workspace }}" --gate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        shell: pwsh
        timeout-minutes: 10
        run: |
          if (Test-Path "package-lock.json") {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            echo "npm ci failed; retrying npm install --legacy-peer-deps."
          } else {
            echo "No package-lock.json found; using npm install --legacy-peer-deps."
          }
          npm install --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ inputs.project-path }}

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=${{ inputs.audit-level }}
        working-directory: ${{ inputs.project-path }}

      - name: Build
        run: ${{ inputs.build-command }}
        working-directory: ${{ inputs.project-path }}

      - name: Validate PWA assets
        shell: pwsh
        run: |
          $output = Join-Path "${{ inputs.project-path }}" "${{ inputs.output-path }}"
          $manifestPath = Join-Path $output "manifest.webmanifest"
          if (-not (Test-Path $manifestPath)) {
            $manifestPath = Join-Path $output "manifest.json"
          }
          if (-not (Test-Path $manifestPath)) { throw "No manifest.webmanifest or manifest.json found in $output." }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.display -ne "standalone") { throw "Manifest display must be standalone." }
          foreach ($size in @("192x192", "512x512")) {
            $any = $manifest.icons | Where-Object { $_.sizes -eq $size -and $_.purpose -like "*any*" }
            $maskable = $manifest.icons | Where-Object { $_.sizes -eq $size -and $_.purpose -like "*maskable*" }
            if (-not $any -or -not $maskable) { throw "Missing $size any/maskable icons." }
          }
          if (-not (Test-Path (Join-Path $output "sw.js"))) { throw "Service worker was not exported." }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-pwa-build
          path: ${{ inputs.project-path }}/${{ inputs.output-path }}

      # M9: run the test suite and HONOUR its exit code.
      #
      # A 2026-07-29 sweep found 53 of 72 active repos whose CI executes no test
      # command at all -- and 11 of those DO have a test suite that CI simply
      # never ran. This lane was a direct cause: it linted and built, and never
      # tested, for every repo that calls it.
      #
      # Absence of a `test` script is not a failure -- many callers are static
      # sites. A test script that FAILS is a failure, and must be, or the green
      # check is a lie. That distinction is the whole point of the rule.
      - name: Test
        shell: pwsh
        working-directory: ${{ inputs.project-path }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.scripts.test) {
            Write-Host "No 'test' script in package.json; nothing to run."
            exit 0
          }
          if ($pkg.scripts.test -match 'no test specified') {
            Write-Host "package.json has the npm-init placeholder test script; skipping."
            exit 0
          }
          Write-Host "Running: npm test"
          npm test --if-present
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tests failed (exit $LASTEXITCODE)."
            exit $LASTEXITCODE
          }
