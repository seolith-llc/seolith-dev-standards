name: Reusable Node PWA Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24.16.0"
      project-path:
        required: false
        type: string
        default: "."
      build-command:
        required: false
        type: string
        default: "npm run build"
      output-path:
        required: false
        type: string
        default: "dist"
      runs-on:
        required: false
        type: string
        # Linux by default since 2026-07-30. The estate's 3 Windows runners
        # were the queue for every build while 3 WSL runners idled --
        # effective capacity was 3 of 7. This lane is pure Node and has no
        # Windows dependency; proven green on Linux in seolith-hindi-buddy#14
        # (node-build) and seolith-box-breathing#4 (node-pwa-build).
        #
        # 'node-capable', NOT 'linux-build': EWA-NUC-KRK-LINUX carries
        # linux-build but is a WSL 1 host whose Node install does not resolve,
        # so every npx there dies instantly. Callers needing Windows can still
        # override this input.
        default: '["self-hosted","Linux","X64","seolith-local","node-capable"]'
      audit-level:
        required: false
        type: string
        description: "info | low | moderate | high | critical; validated before the build job"
        default: "high"
    secrets:
      PACKAGES_READ_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  # M6: runs-on is resolved before any step of the work job runs, so it
  # cannot be validated from inside that job. This job runs on a fixed,
  # non-caller-controlled label first and rejects any runs-on value not
  # already proven safe -- closing "caller picks the machine" without
  # changing behavior for any existing caller. Allow-list built from every
  # runs-on override actually in use estate-wide as of 2026-09-06; add a new
  # entry here deliberately if a new pool genuinely needs one.
  resolve-runner:
    runs-on: [self-hosted]
    permissions: {}
    outputs:
      runs-on: ${{ steps.validate.outputs.runs-on }}
      audit-level: ${{ steps.validate.outputs.audit-level }}
    steps:
      - name: Validate requested runner label set
        id: validate
        shell: bash
        env:
          REQUESTED: ${{ inputs.runs-on }}
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          set -euo pipefail
          case "$REQUESTED" in
            '["self-hosted","Linux","X64","seolith-local","node-capable"]'|'["self-hosted","Windows","X64"]'|'["self-hosted","windows","x64"]')
              ;;
            *)
              echo "::error::runs-on input '$REQUESTED' is not an approved label set for this workflow. A caller cannot redirect this job to an arbitrary runner -- add the new label set here deliberately if a new pool genuinely needs it."
              exit 1
              ;;
          esac
          case "$AUDIT_LEVEL" in
            info|low|moderate|high|critical) ;;
            *)
              echo "::error::audit-level must be info, low, moderate, high, or critical."
              exit 1
              ;;
          esac
          printf 'runs-on=%s\n' "$REQUESTED" >> "$GITHUB_OUTPUT"
          printf 'audit-level=%s\n' "$AUDIT_LEVEL" >> "$GITHUB_OUTPUT"

  build-and-validate:
    needs: [resolve-runner]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs-on) }}
    timeout-minutes: 25
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Run AgentShield Security Scan
        run: npx --yes ecc-agentshield@1.4.0 scan --path "${{ github.workspace }}" --gate

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        shell: pwsh
        timeout-minutes: 10
        run: |
          if (Test-Path "package-lock.json") {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            echo "npm ci failed; retrying npm install --legacy-peer-deps."
          } else {
            echo "No package-lock.json found; using npm install --legacy-peer-deps."
          }
          npm install --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ inputs.project-path }}

      - name: Audit dependencies
        shell: bash
        env:
          AUDIT_LEVEL: ${{ needs.resolve-runner.outputs.audit-level }}
        run: npm audit --omit=dev --audit-level="$AUDIT_LEVEL"
        working-directory: ${{ inputs.project-path }}

      - name: Build
        shell: pwsh
        working-directory: ${{ inputs.project-path }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          # Tokenize and invoke directly instead of letting the templated
          # string stand as the whole script: a caller-supplied command is
          # expected, but binding it via env first keeps the value out of the
          # workflow's own text-substitution step (which runs before any
          # shell parses this file).
          $argv = @($env:BUILD_COMMAND -split '\s+' | Where-Object { $_ -ne '' })
          if ($argv.Count -eq 0) { throw "build-command resolved to an empty command." }
          $exe = $argv[0]
          $rest = if ($argv.Count -gt 1) { $argv[1..($argv.Count - 1)] } else { @() }
          & $exe @rest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate PWA assets
        shell: pwsh
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
          OUTPUT_PATH: ${{ inputs.output-path }}
        run: |
          $output = Join-Path $env:PROJECT_PATH $env:OUTPUT_PATH
          $manifestPath = Join-Path $output "manifest.webmanifest"
          if (-not (Test-Path $manifestPath)) {
            $manifestPath = Join-Path $output "manifest.json"
          }
          if (-not (Test-Path $manifestPath)) { throw "No manifest.webmanifest or manifest.json found in $output." }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.display -ne "standalone") { throw "Manifest display must be standalone." }
          foreach ($size in @("192x192", "512x512")) {
            $any = $manifest.icons | Where-Object { $_.sizes -eq $size -and $_.purpose -like "*any*" }
            $maskable = $manifest.icons | Where-Object { $_.sizes -eq $size -and $_.purpose -like "*maskable*" }
            if (-not $any -or -not $maskable) { throw "Missing $size any/maskable icons." }
          }
          if (-not (Test-Path (Join-Path $output "sw.js"))) { throw "Service worker was not exported." }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-pwa-build
          path: ${{ inputs.project-path }}/${{ inputs.output-path }}

      # M9: run the test suite and HONOUR its exit code.
      #
      # A 2026-07-29 sweep found 53 of 72 active repos whose CI executes no test
      # command at all -- and 11 of those DO have a test suite that CI simply
      # never ran. This lane was a direct cause: it linted and built, and never
      # tested, for every repo that calls it.
      #
      # Absence of a `test` script is not a failure -- many callers are static
      # sites. A test script that FAILS is a failure, and must be, or the green
      # check is a lie. That distinction is the whole point of the rule.
      - name: Test
        timeout-minutes: 15
        shell: pwsh
        working-directory: ${{ inputs.project-path }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.scripts.test) {
            Write-Host "No 'test' script in package.json; nothing to run."
            exit 0
          }
          if ($pkg.scripts.test -match 'no test specified') {
            Write-Host "package.json has the npm-init placeholder test script; skipping."
            exit 0
          }
          Write-Host "Running: npm test"
          npm test --if-present
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tests failed (exit $LASTEXITCODE)."
            exit $LASTEXITCODE
          }
