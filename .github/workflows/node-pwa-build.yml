name: Reusable Node PWA Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24.16.0"
      project-path:
        required: false
        type: string
        default: "."
      build-command:
        required: false
        type: string
        default: "npm run build"
      output-path:
        required: false
        type: string
        default: "dist"
      runs-on:
        required: false
        type: string
        default: '["self-hosted","Windows","X64"]'
      audit-level:
        required: false
        type: string
        default: "high"

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Run AgentShield Security Scan
        run: npx ecc-agentshield scan --gate

      - name: Detect npm lockfile
        id: lockfile
        shell: pwsh
        run: |
          $lockfile = Join-Path "${{ inputs.project-path }}" "package-lock.json"
          if (Test-Path $lockfile) {
            "path=$lockfile" >> $env:GITHUB_OUTPUT
            echo "Using npm cache dependency path: $lockfile"
          }

      - name: Setup Node.js with npm cache
        if: steps.lockfile.outputs.path != ''
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ steps.lockfile.outputs.path }}

      - name: Setup Node.js
        if: steps.lockfile.outputs.path == ''
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        shell: pwsh
        timeout-minutes: 10
        run: |
          if (Test-Path "package-lock.json") {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            echo "npm ci failed; retrying npm install --legacy-peer-deps."
          } else {
            echo "No package-lock.json found; using npm install --legacy-peer-deps."
          }
          npm install --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ inputs.project-path }}

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=${{ inputs.audit-level }}
        working-directory: ${{ inputs.project-path }}

      - name: Build
        run: ${{ inputs.build-command }}
        working-directory: ${{ inputs.project-path }}

      - name: Validate PWA assets
        shell: pwsh
        run: |
          $output = Join-Path "${{ inputs.project-path }}" "${{ inputs.output-path }}"
          $manifestPath = Join-Path $output "manifest.webmanifest"
          if (-not (Test-Path $manifestPath)) {
            $manifestPath = Join-Path $output "manifest.json"
          }
          if (-not (Test-Path $manifestPath)) { throw "No manifest.webmanifest or manifest.json found in $output." }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.display -ne "standalone") { throw "Manifest display must be standalone." }
          foreach ($size in @("192x192", "512x512")) {
            $any = $manifest.icons | Where-Object { $_.sizes -eq $size -and $_.purpose -like "*any*" }
            $maskable = $manifest.icons | Where-Object { $_.sizes -eq $size -and $_.purpose -like "*maskable*" }
            if (-not $any -or -not $maskable) { throw "Missing $size any/maskable icons." }
          }
          if (-not (Test-Path (Join-Path $output "sw.js"))) { throw "Service worker was not exported." }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-pwa-build
          path: ${{ inputs.project-path }}/${{ inputs.output-path }}
