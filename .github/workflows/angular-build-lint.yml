name: Reusable Angular Lint & Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"
      project-path:
        required: false
        type: string
        default: "."

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run AgentShield Security Scan
        run: npx ecc-agentshield scan --fail-on-critical
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: "${{ inputs.project-path }}/package-lock.json"
          
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.project-path }}
        
      - name: Lint
        run: npm run lint
        working-directory: ${{ inputs.project-path }}
        continue-on-error: true
        
      - name: Build
        run: npm run build
        working-directory: ${{ inputs.project-path }}
