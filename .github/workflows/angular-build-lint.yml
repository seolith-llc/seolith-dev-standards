name: Reusable Angular Lint & Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24.16.0"
      project-path:
        required: false
        type: string
        default: "."
      runs-on:
        required: false
        type: string
        default: '["self-hosted","Windows","X64"]'

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 25
    env:
      CI: "true"
      NG_CLI_ANALYTICS: "false"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PROGRESS: "false"
    steps:
      - uses: actions/checkout@v5
      
      - name: Run AgentShield Security Scan
        run: npx ecc-agentshield scan --gate

      - name: Detect Project Path
        id: detect
        shell: pwsh
        run: |
          $TARGET = "${{ inputs.project-path }}"
          if (-not (Test-Path (Join-Path $TARGET "package.json"))) {
            $packages = Get-ChildItem -Recurse -Depth 6 -Filter package.json |
              Where-Object { $_.FullName -notmatch "[\\/]node_modules[\\/]" } |
              Sort-Object @{ Expression = { $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count } }, FullName
            $FOUND = $packages | Where-Object {
              (Test-Path (Join-Path $_.Directory.FullName "angular.json")) -or
              ((Get-Content -Raw $_.FullName) -match "@angular/core")
            } | Select-Object -First 1
            if (-not $FOUND) { $FOUND = $packages | Select-Object -First 1 }
            if ($FOUND) { $TARGET = $FOUND.Directory.FullName }
          }
          "path=$TARGET" >> $env:GITHUB_OUTPUT
          echo "Detected Angular path: $TARGET"

      - name: Detect npm lockfile
        id: lockfile
        shell: pwsh
        run: |
          $lockfile = Join-Path "${{ steps.detect.outputs.path }}" "package-lock.json"
          if (Test-Path $lockfile) {
            "path=$lockfile" >> $env:GITHUB_OUTPUT
            echo "Using npm cache dependency path: $lockfile"
          }

      - name: Setup Node.js with npm cache
        if: steps.lockfile.outputs.path != ''
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ steps.lockfile.outputs.path }}

      - name: Setup Node.js
        if: steps.lockfile.outputs.path == ''
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        timeout-minutes: 10
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            echo "npm ci failed; retrying npm install --legacy-peer-deps."
          } else {
            echo "No package-lock.json found; using npm install --legacy-peer-deps."
          }
          npm install --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ steps.detect.outputs.path }}
        
      - name: Lint
        timeout-minutes: 5
        run: npm run lint
        working-directory: ${{ steps.detect.outputs.path }}
        continue-on-error: true
        
      - name: Build
        timeout-minutes: 10
        shell: pwsh
        run: |
          Set-Location "${{ steps.detect.outputs.path }}"
          if (Test-Path "angular.json") {
            npm run build
            if ($LASTEXITCODE -ne 0) {
              $workspace = Get-Content -Raw angular.json | ConvertFrom-Json
              foreach ($project in $workspace.projects.PSObject.Properties.Name) {
                npx ng build $project
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
          } else {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
