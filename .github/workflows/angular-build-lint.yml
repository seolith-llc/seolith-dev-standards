name: Reusable Angular Lint & Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24.16.0"
      project-path:
        required: false
        type: string
        default: "."
      runs-on:
        required: false
        type: string
        default: '["self-hosted","Windows","X64","seolith-local"]'

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 25
    env:
      CI: "true"
      NG_CLI_ANALYTICS: "false"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PROGRESS: "false"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run AgentShield Security Scan
        run: npx ecc-agentshield scan --path "${{ github.workspace }}" --gate

      - name: Detect Project Path
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.project-path }}"
          if [[ ! -f "$target/package.json" ]]; then
            target=""
            while IFS= read -r package; do
              directory="$(dirname "$package")"
              if [[ -f "$directory/angular.json" ]] || grep -q '"@angular/core"' "$package"; then
                target="$directory"
                break
              fi
            done < <(find . -maxdepth 6 -type f -name package.json -not -path '*/node_modules/*' -print | sort)
          fi
          [[ -n "$target" && -f "$target/package.json" ]] || { echo "No Angular package found." >&2; exit 1; }
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "Detected Angular path: $target"

      - name: Install dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "No package-lock.json found; using npm install --legacy-peer-deps."
            npm install --legacy-peer-deps
          fi
        working-directory: ${{ steps.detect.outputs.path }}

      - name: Lint
        timeout-minutes: 5
        run: npm run lint
        working-directory: ${{ steps.detect.outputs.path }}
        continue-on-error: true

      - name: Build
        timeout-minutes: 10
        run: npm run build
        working-directory: ${{ steps.detect.outputs.path }}
