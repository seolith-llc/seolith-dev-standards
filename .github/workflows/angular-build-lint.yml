name: Reusable Angular Lint & Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"
      project-path:
        required: false
        type: string
        default: "."

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Run AgentShield Security Scan
        run: npx ecc-agentshield scan --gate
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          
      - name: Detect Project Path
        id: detect
        run: |
          TARGET="${{ inputs.project-path }}"
          if [ ! -f "$TARGET/package.json" ]; then
            FOUND=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            if [ ! -z "$FOUND" ]; then
              TARGET=$(dirname "$FOUND")
            fi
          fi
          echo "path=$TARGET" >> $GITHUB_OUTPUT
          echo "Detected Angular path: $TARGET"

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ steps.detect.outputs.path }}
        
      - name: Lint
        run: npm run lint
        working-directory: ${{ steps.detect.outputs.path }}
        continue-on-error: true
        
      - name: Build
        run: npm run build
        working-directory: ${{ steps.detect.outputs.path }}
