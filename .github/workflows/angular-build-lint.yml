name: Reusable Angular Lint & Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24.16.0"
      project-path:
        required: false
        type: string
        default: "."
      # DEFAULTS TO "critical", NOT "high" -- deliberately, and temporarily.
      #
      # This lane had no audit step at all until 2026-08-05, so its consumers
      # have never had a dependency gate. Measured before adding one, against
      # each repo's COMMITTED lockfile in the path this lane actually audits:
      # at --audit-level=high, 24 of 26 active consumers fail. That includes
      # every flagship (SCL, second-chance-leads, clinical-trial-ai-agent,
      # SEOlithAI4PCI), with counts from 1 to 37.
      #
      # Shipping that as blocking would red the estate in one push. Shipping
      # it non-blocking would recreate the exact decorative gate removed from
      # this file and node-build.yml the day before.
      #
      # So: a REAL gate, honouring its exit code, calibrated where it changes
      # nothing today. There are currently ZERO criticals across all 26
      # consumers, so nothing breaks on merge, and any NEW critical is caught
      # immediately. This is not the same as continue-on-error: the result is
      # honoured, and the threshold is declared in the caller where it is
      # visible and reviewable.
      #
      # The backlog behind the "high" threshold splits three ways:
      #   npm audit fix alone      clears some outright (SCL 1 -> 0)
      #   overrides                undici, postcss, immutable, ip-address
      #   an Angular upgrade       the @angular/* advisory cluster -- i18n XSS
      #                            and XSRF token leakage via protocol-relative
      #                            URLs. 12 of second-chance-leads' 16 residual
      #                            highs are this. It is the dominant root
      #                            cause and it is a programme, not a bump.
      #
      # RATCHET, don't relax: as a repo is cleared, set audit-level: 'high' in
      # ITS caller. Do not lower this shared default, and never add
      # continue-on-error to the step below.
      audit-level:
        required: false
        type: choice
        options: ["info", "low", "moderate", "high", "critical"]
        default: "critical"
      runs-on:
        required: false
        type: string
        # WINDOWS by default -- but the Linux blocker is now CLEARED.
        #
        # HISTORY, because this comment has been wrong before. It once claimed
        # "Chrome is installed on the WSL runners". That was false: it had been
        # verified on the Windows side of the machine and wrongly asserted of
        # the Linux side. Repos on the karma builder need a real browser, and
        # on the WSL runners karma logged
        #     ERROR [launcher]: No binary for Chrome browser on your platform.
        # then executed ZERO specs, while `ng test` sat in watch mode until the
        # 25-minute job bound killed it. The same suite passed on Windows.
        # Evidence: clinical-trial-ai-agent#26, runs 30586122448 / 30586122482.
        # Two costs, not one -- coverage disappearing quietly, AND a scarce
        # node-capable slot burned for 25 minutes instead of failing fast.
        #
        # 2026-07-31, verified rather than assumed: Google Chrome 151.0.7922.71
        # is installed on the WSL Ubuntu host that backs all three node-capable
        # runners (LKS-LLC-DESKTOP-WSL, -WSL-1, -WSL-2 are three runner
        # directories inside ONE Ubuntu rootfs, so one install serves all
        # three), and CHROME_BIN=/usr/bin/google-chrome-stable is exported from
        # each runner's .env -- the same mechanism that already carries
        # DOTNET_INSTALL_DIR. Headless launch verified with the sandbox intact,
        # so no --no-sandbox workaround is needed in any caller's karma.conf.
        #
        # Belt and braces: the Test step below no longer trusts this comment.
        # It preflights for a real browser whenever the karma builder is in
        # play and fails in seconds with an actionable message if one is
        # missing, so a regression here can never again masquerade as a pass.
        #
        # The default stays Windows only because flipping it changes behaviour
        # for every caller at once, which is a separate and deliberate change.
        # Callers may now override to the Linux set:
        #     runs-on: '["self-hosted","Linux","X64","seolith-local","node-capable"]'
        # Use node-capable, never bare linux-build: EWA-NUC-KRK-LINUX is a
        # WSL 1 host and cannot run Node at all.
        default: '["self-hosted","Windows","X64","seolith-local"]'
    secrets:
      PACKAGES_READ_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  # M6: runs-on is resolved before any step of the work job runs, so it
  # cannot be validated from inside that job. This job runs on a fixed,
  # non-caller-controlled label first and rejects any runs-on value not
  # already proven safe -- closing "caller picks the machine" without
  # changing behavior for any existing caller. Allow-list built from every
  # runs-on override actually in use estate-wide as of 2026-09-06; add a new
  # entry here deliberately if a new pool genuinely needs one.
  resolve-runner:
    runs-on: [self-hosted]
    permissions: {}
    outputs:
      runs-on: ${{ steps.validate.outputs.runs-on }}
    steps:
      - name: Validate requested runner label set
        id: validate
        shell: bash
        env:
          REQUESTED: ${{ inputs.runs-on }}
        run: |
          set -euo pipefail
          case "$REQUESTED" in
            '["self-hosted","Windows","X64","seolith-local"]'|'["self-hosted","Windows","X64"]'|'["self-hosted","windows","x64"]'|'["self-hosted","Linux","X64","seolith-local","linux-build"]'|'["self-hosted","Linux","X64","seolith-local","node-capable"]'|'["self-hosted","linux","x64"]')
              ;;
            *)
              echo "::error::runs-on input '$REQUESTED' is not an approved label set for this workflow. A caller cannot redirect this job to an arbitrary runner -- add the new label set here deliberately if a new pool genuinely needs it."
              exit 1
              ;;
          esac
          printf 'runs-on=%s\n' "$REQUESTED" >> "$GITHUB_OUTPUT"

  lint-and-build:
    needs: [resolve-runner]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs-on) }}
    timeout-minutes: 25
    env:
      CI: "true"
      NG_CLI_ANALYTICS: "false"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PROGRESS: "false"
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false

      - name: Run AgentShield Security Scan
        run: npx --yes ecc-agentshield@1.4.0 scan --path "${{ github.workspace }}" --gate

      - name: Detect Project Path
        id: detect
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          target="$PROJECT_PATH"
          if [[ ! -f "$target/package.json" ]]; then
            target=""
            while IFS= read -r package; do
              directory="$(dirname "$package")"
              if [[ -f "$directory/angular.json" ]] || grep -q '"@angular/core"' "$package"; then
                target="$directory"
                break
              fi
            done < <(find . -maxdepth 6 -type f -name package.json -not -path '*/node_modules/*' -print | sort)
          fi
          [[ -n "$target" && -f "$target/package.json" ]] || { echo "No Angular package found." >&2; exit 1; }
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "Detected Angular path: $target"

      - name: Install dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "No package-lock.json found; using npm install --legacy-peer-deps."
            npm install --legacy-peer-deps
          fi
        working-directory: ${{ steps.detect.outputs.path }}

      # ADDED 2026-08-05. This lane audited NOTHING before today, while
      # node-build.yml at least had an audit step (albeit a decorative one
      # until #62). So the 26 active consumers of this lane had no dependency
      # gate whatsoever -- an absent one, not a disabled one, which is why it
      # went unnoticed longer.
      #
      # Found via lks-ads, which carries 3 HIGH advisories (fast-uri, postcss,
      # undici) that no CI run in this estate has ever reported.
      #
      # See the audit-level input above for why the default is "critical" and
      # how to ratchet a cleared repo up to "high". NO continue-on-error here,
      # deliberately and permanently.
      - name: Audit dependencies
        run: npm audit --audit-level=${{ inputs.audit-level }}
        working-directory: ${{ steps.detect.outputs.path }}

      # This step was `continue-on-error: true` until 2026-08-04, so lint could
      # not fail a build. Removing that flag alone would have turned 18 of the
      # 27 consumers red at once -- and 17 of those NOT because of lint errors,
      # but because they have no `lint` script at all, so `npm run lint` exits
      # with "Missing script: lint". The flag was mostly hiding a missing
      # script, not failing code. Measured by running lint in every consumer.
      #
      # So the step is guarded first, matching what node-build.yml already does
      # for a missing build script: no lint script means skip and SAY so, as a
      # warning annotation, so it reads as a gap to fill rather than a pass.
      #
      # With the guard in place the flag is gone, so a repo that HAS a lint
      # script and fails it now blocks. On measurement that is exactly one
      # repo -- lks-ads -- whose real lint errors were being swallowed.
      #
      # Do NOT restore continue-on-error, and do not try to check whether it is
      # safe by reading step conclusions: the jobs API reports a
      # continue-on-error step as conclusion=success even when the command
      # exited non-zero. That method was tried here and returned a clean bill
      # of health that was entirely false. Measure by running the command.
      - name: Lint
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if ! node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            echo "::warning::No 'lint' script in package.json -- skipping lint. This repo is not linted in CI."
            exit 0
          fi
          npm run lint
        working-directory: ${{ steps.detect.outputs.path }}

      - name: Build
        timeout-minutes: 10
        run: npm run build
        working-directory: ${{ steps.detect.outputs.path }}

      # M9: run the test suite and HONOUR its exit code.
      #
      # A 2026-07-29 sweep found 53 of 72 active repos whose CI executes no test
      # command at all -- and 11 of those DO have a test suite that CI simply
      # never ran. This lane was a direct cause: it linted and built, and never
      # tested, for every repo that calls it.
      #
      # Absence of a `test` script is not a failure -- many callers are static
      # sites. A test script that FAILS is a failure, and must be, or the green
      # check is a lie. That distinction is the whole point of the rule.
      #
      # A missing browser must ERROR IN SECONDS, not merely be bounded.
      #
      # #55 added the timeout-minutes below, which stops a hung suite eating
      # the whole 25-minute job. That is the right backstop but it is not a
      # diagnosis: `npm test` runs `ng test`, which starts karma in WATCH mode
      # and never exits, so a runner with no Chrome still burned 15 minutes of
      # a scarce node-capable slot and then reported *cancelled* -- which reads
      # like a flake rather than naming the real cause. Two faster bounds now
      # sit in front of it: a browser preflight that fails in seconds, and
      # --watch=false so a single run can actually terminate on its own.
      #
      # The timeout stays at #55's 15 minutes deliberately. It is now a pure
      # backstop for genuinely slow suites, so there is no reason to tighten
      # it and risk failing a large but healthy test run.
      - name: Test
        timeout-minutes: 15
        shell: pwsh
        working-directory: ${{ steps.detect.outputs.path }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $testScript = $pkg.scripts.test
          if (-not $testScript) {
            Write-Host "No 'test' script in package.json; nothing to run."
            exit 0
          }
          if ($testScript -match 'no test specified') {
            Write-Host "package.json has the npm-init placeholder test script; skipping."
            exit 0
          }

          # -- Browser preflight, karma only ---------------------------------
          # karma drives a REAL browser. With none it prints "No binary for
          # Chrome browser on your platform" and then runs ZERO specs, which is
          # a silent coverage hole, so prove a browser exists BEFORE ng starts.
          # The vitest builder (@angular/build:unit-test) needs no browser and
          # is deliberately not gated here.
          $usesKarma = $false
          if (Test-Path 'angular.json') {
            $ng = Get-Content 'angular.json' -Raw | ConvertFrom-Json
            if ($ng.projects) {
              foreach ($proj in $ng.projects.PSObject.Properties) {
                foreach ($holder in @($proj.Value.architect, $proj.Value.targets)) {
                  if ($holder -and $holder.test -and $holder.test.builder -match 'karma') {
                    $usesKarma = $true
                  }
                }
              }
            }
          }
          foreach ($conf in @('karma.conf.js', 'karma.conf.cjs', 'karma.conf.ts')) {
            if (Test-Path $conf) { $usesKarma = $true }
          }

          if ($usesKarma) {
            $chrome = $null
            foreach ($candidate in @($env:CHROME_BIN, $env:CHROME_PATH)) {
              if ($candidate -and (Test-Path $candidate)) { $chrome = $candidate; break }
            }
            if (-not $chrome) {
              foreach ($name in @('google-chrome-stable', 'google-chrome', 'chromium', 'chromium-browser', 'chrome')) {
                $cmd = Get-Command $name -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($cmd) { $chrome = $cmd.Source; break }
              }
            }
            if (-not $chrome -and $IsWindows) {
              # Windows Chrome is not on PATH; karma-chrome-launcher finds it by
              # well-known path, so the preflight has to look the same places.
              foreach ($p in @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
                               "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
                               "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe")) {
                if ($p -and (Test-Path $p)) { $chrome = $p; break }
              }
            }
            if (-not $chrome) {
              Write-Host "::error::This project uses the karma test builder, which needs a real browser, and none was found on runner '$env:RUNNER_NAME'. karma would capture no browser and silently execute ZERO specs. Install Chrome/Chromium on this runner, or export CHROME_BIN from its .env."
              exit 1
            }
            $env:CHROME_BIN = $chrome
            Write-Host "karma builder detected; using browser: $chrome"
          }

          # -- Never run a watch server under CI ------------------------------
          # `ng test` defaults to a watcher that never exits. Force a single
          # run; both the karma and the unit-test (vitest) builders take
          # --watch. Only appended for `ng test`, since an arbitrary test
          # script (jest, node --test) may reject the flag.
          $extraArgs = @()
          if ($testScript -match '(^|\s|&&|;)ng\s+test(\s|$)') {
            $extraArgs = @('--', '--watch=false')
          }

          Write-Host "Running: npm test $($extraArgs -join ' ')"
          npm test --if-present @extraArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tests failed (exit $LASTEXITCODE)."
            exit $LASTEXITCODE
          }
