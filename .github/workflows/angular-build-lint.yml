name: Reusable Angular Lint & Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24.16.0"
      project-path:
        required: false
        type: string
        default: "."
      runs-on:
        required: false
        type: string
        # WINDOWS, deliberately -- reverted 2026-07-30 the same day it was
        # changed, because the change was made on a false premise.
        #
        # The previous comment here claimed "Chrome is installed on the WSL
        # runners". It is not: there is no chrome/chromium binary in WSL at
        # all, and CHROME_BIN is unset. That was verified on the WINDOWS side
        # of the machine and wrongly asserted of the Linux side.
        #
        # The consequence is worse than a build failure. Repos whose Angular
        # tests use the karma builder need a real browser; on Linux karma
        # logs "No binary for Chrome browser" and executes ZERO specs, where
        # the same suite reports passing tests on Windows. That is coverage
        # disappearing quietly, which is exactly the failure mode this estate
        # has been digging out of all week.
        #
        # A caller whose app uses the @angular/build:unit-test (vitest)
        # builder needs no browser and CAN override this to the Linux set --
        # seolith-ortho#14 proved that end to end. Making that the default is
        # only safe once Chrome exists on the node-capable runners.
        default: '["self-hosted","Windows","X64","seolith-local"]'

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 25
    env:
      CI: "true"
      NG_CLI_ANALYTICS: "false"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PROGRESS: "false"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run AgentShield Security Scan
        run: npx --yes ecc-agentshield@1.4.0 scan --path "${{ github.workspace }}" --gate

      - name: Detect Project Path
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.project-path }}"
          if [[ ! -f "$target/package.json" ]]; then
            target=""
            while IFS= read -r package; do
              directory="$(dirname "$package")"
              if [[ -f "$directory/angular.json" ]] || grep -q '"@angular/core"' "$package"; then
                target="$directory"
                break
              fi
            done < <(find . -maxdepth 6 -type f -name package.json -not -path '*/node_modules/*' -print | sort)
          fi
          [[ -n "$target" && -f "$target/package.json" ]] || { echo "No Angular package found." >&2; exit 1; }
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "Detected Angular path: $target"

      - name: Install dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "No package-lock.json found; using npm install --legacy-peer-deps."
            npm install --legacy-peer-deps
          fi
        working-directory: ${{ steps.detect.outputs.path }}

      - name: Lint
        timeout-minutes: 5
        run: npm run lint
        working-directory: ${{ steps.detect.outputs.path }}
        continue-on-error: true

      - name: Build
        timeout-minutes: 10
        run: npm run build
        working-directory: ${{ steps.detect.outputs.path }}

      # M9: run the test suite and HONOUR its exit code.
      #
      # A 2026-07-29 sweep found 53 of 72 active repos whose CI executes no test
      # command at all -- and 11 of those DO have a test suite that CI simply
      # never ran. This lane was a direct cause: it linted and built, and never
      # tested, for every repo that calls it.
      #
      # Absence of a `test` script is not a failure -- many callers are static
      # sites. A test script that FAILS is a failure, and must be, or the green
      # check is a lie. That distinction is the whole point of the rule.
      - name: Test
        shell: pwsh
        working-directory: ${{ steps.detect.outputs.path }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.scripts.test) {
            Write-Host "No 'test' script in package.json; nothing to run."
            exit 0
          }
          if ($pkg.scripts.test -match 'no test specified') {
            Write-Host "package.json has the npm-init placeholder test script; skipping."
            exit 0
          }
          Write-Host "Running: npm test"
          npm test --if-present
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tests failed (exit $LASTEXITCODE)."
            exit $LASTEXITCODE
          }
