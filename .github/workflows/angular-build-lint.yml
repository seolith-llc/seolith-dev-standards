name: Reusable Angular Lint & Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"
      project-path:
        required: false
        type: string
        default: "."
      runs-on:
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      
      - name: Run AgentShield Security Scan
        run: npx ecc-agentshield scan --gate
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          
      - name: Detect Project Path
        id: detect
        run: |
          TARGET="${{ inputs.project-path }}"
          if [ ! -f "$TARGET/package.json" ]; then
            # Find all package.json files, sort by depth (slash count)
            # Prioritize directories containing 'angular.json' or having 'angular' in the path
            FOUND=$(find . -maxdepth 6 -name "package.json" -not -path "*/node_modules/*" | awk -F/ '{ print NF, $0 }' | sort -k1,1n | awk '{print $2}' | while read p; do
              DIR=$(dirname "$p")
              if [ -f "$DIR/angular.json" ] || grep -q "@angular/core" "$p"; then
                echo "$p"
                break
              fi
            done | head -n 1)
            
            if [ ! -z "$FOUND" ]; then
              TARGET=$(dirname "$FOUND")
            else
              # Fallback to shallowest package.json if no angular specific ones found
              FOUND=$(find . -maxdepth 6 -name "package.json" -not -path "*/node_modules/*" | awk -F/ '{ print NF, $0 }' | sort -k1,1n | awk '{print $2}' | head -n 1)
              if [ ! -z "$FOUND" ]; then
                TARGET=$(dirname "$FOUND")
              fi
            fi
          fi
          echo "path=$TARGET" >> $GITHUB_OUTPUT
          echo "Detected Angular path: $TARGET"

      - name: Install dependencies
        run: npm ci || npm install
        working-directory: ${{ steps.detect.outputs.path }}
        
      - name: Lint
        run: npm run lint
        working-directory: ${{ steps.detect.outputs.path }}
        continue-on-error: true
        
      - name: Build
        run: |
          PATH_VAR="${{ steps.detect.outputs.path }}"
          cd "$PATH_VAR"
          if [ -f "angular.json" ]; then
            # Try to build all projects if it's a workspace and regular build fails
            npm run build || (npx ng build --all || npx ng build $(jq -r '.defaultProject // .projects | keys | .[0]' angular.json))
          else
            npm run build
          fi
