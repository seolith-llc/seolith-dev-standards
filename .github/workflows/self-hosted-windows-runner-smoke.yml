name: Self-Hosted Windows Runner Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, windows, x64, seolith-build]
    steps:
      - name: Check runner tools
        shell: pwsh
        run: |
          $PSVersionTable
          git --version
          docker --version
          node --version
          dotnet --info
