name: Regenerate lockfile (reusable)

# Shared one-shot maintenance workflow: refreshes package-lock.json /
# pnpm-lock.yaml / yarn.lock on a branch and opens a PR.
#
# WHY THIS EXISTS. The lockfile cannot be regenerated on a dev machine whose
# token lacks read:packages (npm 401s on @seolith-llc/* from GitHub Packages),
# and `npm ci` in CI needs the @seolith-llc/* entries present. The org PAT
# (PACKAGES_READ_TOKEN) has packages:read, so CI can do what the laptop
# cannot. GITHUB_TOKEN-opened PRs do not trigger CI runs -- close and reopen
# the PR if you want the gates to execute on it.
#
# Callers: see the repos that previously carried a copy-pasted
# regen-lockfile.yml (critter-path-adventures, seolith-hindi-buddy, ...).

on:
  workflow_call:
    inputs:
      project-path:
        description: "Directory containing package.json (default: repo root)"
        required: false
        type: string
        default: '.'
      node-version:
        required: false
        type: string
        default: '24'
      runs-on:
        required: false
        type: string
        default: '["self-hosted","Linux","X64","seolith-local","node-capable"]'
    secrets:
      PACKAGES_READ_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # M6: runs-on is resolved before any step of the work job runs, so it
  # cannot be validated from inside that job. This job runs on a fixed,
  # non-caller-controlled label first and rejects any runs-on value not
  # already proven safe -- closing "caller picks the machine" without
  # changing behavior for any existing caller. Allow-list built from every
  # runs-on override actually in use estate-wide as of 2026-09-06; add a new
  # entry here deliberately if a new pool genuinely needs one.
  resolve-runner:
    runs-on: [self-hosted]
    permissions: {}
    outputs:
      runs-on: ${{ steps.validate.outputs.runs-on }}
    steps:
      - name: Validate requested runner label set
        id: validate
        shell: bash
        env:
          REQUESTED: ${{ inputs.runs-on }}
        run: |
          set -euo pipefail
          case "$REQUESTED" in
            '["self-hosted","Linux","X64","seolith-local","node-capable"]')
              ;;
            *)
              echo "::error::runs-on input '$REQUESTED' is not an approved label set for this workflow. A caller cannot redirect this job to an arbitrary runner -- add the new label set here deliberately if a new pool genuinely needs it."
              exit 1
              ;;
          esac
          printf 'runs-on=%s\n' "$REQUESTED" >> "$GITHUB_OUTPUT"

  regen:
    needs: [resolve-runner]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@seolith-llc'

      - name: Regenerate lockfile
        working-directory: ${{ inputs.project-path }}
        env:
          # PACKAGES_READ_TOKEN (org secret), not GITHUB_TOKEN: packages
          # published by another repo's workflow are readable by a DIFFERENT
          # repo's GITHUB_TOKEN only via per-package Actions-access grants
          # (UI-only). The org PAT is the estate's existing pattern (the NuGet
          # lane uses it the same way).
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail
          # The project-level .npmrc shadows the root .npmrc setup-node
          # wrote. npm/pnpm expand ${NODE_AUTH_TOKEN} from the environment itself.
          [ -f .npmrc ] || touch .npmrc
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> .npmrc
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            corepack prepare --activate "$(node -p "require('./package.json').packageManager || 'pnpm@latest'")"
            pnpm install --lockfile-only
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --mode update-lockfile
          else
            npm install --package-lock-only
          fi

      - name: Push branch and open PR
        working-directory: ${{ inputs.project-path }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "seolith-bot"
          git config user.email "bot@seolith.com"
          git checkout -b chore/regen-lockfile
          if [ -f pnpm-lock.yaml ]; then
            git add pnpm-lock.yaml
          elif [ -f yarn.lock ]; then
            git add yarn.lock
          else
            git add package-lock.json
          fi
          if git diff --cached --quiet; then
            echo "lockfile unchanged; nothing to do"
            exit 0
          fi
          git commit -m "chore: regenerate lockfile with @seolith-llc/* entries"
          git push -u origin chore/regen-lockfile --force
          # gh pr create fails (and previously failed SILENTLY behind || echo)
          # when a merged/closed PR already exists for this branch. Reuse an
          # open PR if one exists; otherwise surface the real error.
          if gh pr list --head chore/regen-lockfile --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create --base main --head chore/regen-lockfile \
              --title "chore: regenerate lockfile" \
              --body "Regenerated in CI with packages:read so @seolith-llc/* resolves. Makes the npm ci lane green."
          else
            echo "open PR for chore/regen-lockfile already exists; branch updated"
          fi
