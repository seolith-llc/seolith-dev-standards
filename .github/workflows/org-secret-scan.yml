name: Org secret sweep

# Scheduled org-wide gitleaks sweep (estate backlog S4). Complements the
# per-repo secret-scan.yml GATE: that gate only ever fires for repos that
# adopted it, and only on their pushes/PRs. This sweep covers every
# non-archived repo in seolith-llc on a schedule -- including repos that
# never adopted the gate -- and REPORTS instead of gating:
#
#   * findings are aggregated into a report artifact and job summary
#     (values redacted; a sweep report must never become a copy of the leak)
#   * drift is reported alongside: which repos lack the PR gate, which lack
#     a repo-local .gitleaks.toml and therefore ran on the canonical config
#   * the workflow fails ONLY on scanner infrastructure errors (clone
#     failures, gitleaks crashing), never on findings -- findings are the
#     sweep's output, not its failure mode
#
# AUTH. GITHUB_TOKEN cannot do this job: it is scoped to THIS repository,
# and 116 of the 120 non-archived org repos are private, so it can neither
# enumerate them nor clone them. The sweep mints a token from the dedicated
# seolith-secret-sweep GitHub App (contents: read-only, installed on all
# repos), whose credentials live in the org secrets SWEEP_APP_ID and
# SWEEP_APP_PRIVATE_KEY, visible to this repository only. Provisioning that
# app is a one-time owner action -- see docs/OWNER_ACTIONS.md. Until it
# exists the enumerate job fails fast with that pointer, deliberately: a
# sweep that silently scans only the 4 public repos would read as org-wide
# coverage while being none.
#
# SCAN SHAPE. Working-tree mode (gitleaks dir), not history: the per-repo
# gate already scans history on every push, and a weekly working-tree sweep
# of ~120 repos stays within minutes of runner time. A secret that exists
# only in history is already covered by the gate's scan-history on the next
# push; only revocation fixes what is already committed.
#
# Config per repo: the repo's own .gitleaks.toml when present (repo-local
# allowlists are respected), else the canonical config from this repo.

on:
  schedule:
    # Sunday 03:47 UTC -- off the :00/:30 herd marks, outside working hours
    # in every tz the estate operates in.
    - cron: '47 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# A sweep that overlaps itself doubles clone load on the runners for no
# benefit; queue the newer run instead of cancelling the older one.
concurrency:
  group: org-secret-sweep
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.30.1"
  # Same pin + checksum as the secret-scan.yml gate. Bumping one without the
  # other forks the estate's scanner version -- change both together.
  GITLEAKS_SHA256_LINUX: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  BATCH_SIZE: "20"

jobs:
  enumerate:
    name: Enumerate org repos
    runs-on: [self-hosted, Linux, X64, seolith-local, linux-build]
    timeout-minutes: 10
    permissions: {}
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
      count: ${{ steps.chunk.outputs.count }}
    steps:
      - name: Check sweep credentials are provisioned
        shell: bash
        env:
          SWEEP_APP_ID: ${{ secrets.SWEEP_APP_ID }}
          SWEEP_APP_PRIVATE_KEY: ${{ secrets.SWEEP_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SWEEP_APP_ID" ] || [ -z "$SWEEP_APP_PRIVATE_KEY" ]; then
            echo "::error::Org secrets SWEEP_APP_ID / SWEEP_APP_PRIVATE_KEY are not provisioned (or not visible to seolith-dev-standards). The sweep cannot enumerate or clone the org's private repos with GITHUB_TOKEN -- provision the seolith-secret-sweep GitHub App per docs/OWNER_ACTIONS.md, then re-run."
            exit 1
          fi

      - name: Mint sweep app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SWEEP_APP_ID }}
          private-key: ${{ secrets.SWEEP_APP_PRIVATE_KEY }}
          owner: seolith-llc
          permission-contents: read

      - name: List non-archived repos and build batches
        id: chunk
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null \
            || { echo "::error::gh CLI missing on runner ${RUNNER_NAME:-?} -- the sweep enumerates via the GitHub API; install gh on the linux-build pool."; exit 1; }
          # /installation/repositories returns exactly the repos the app can
          # clone -- the enumerable set and the scannable set cannot drift apart.
          gh api /installation/repositories --paginate \
            --jq '.repositories[] | select(.archived | not) | .name' | sort > repos.txt
          python3 - <<'PY' || python - <<'PY'
          import json, os
          repos = [l.strip() for l in open("repos.txt", encoding="utf-8") if l.strip()]
          size = int(os.environ.get("BATCH_SIZE", "20"))
          batches = [
              {"i": n + 1, "repos": " ".join(repos[k:k + size])}
              for n, k in enumerate(range(0, len(repos), size))
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("matrix=" + json.dumps({"include": batches}) + "\n")
              out.write("count=%d\n" % len(repos))
          print("%d non-archived repos, %d batch(es) of up to %d" % (len(repos), len(batches), size))
          PY

      - name: Upload repo list
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: org-secret-sweep-repos
          path: repos.txt
          retention-days: 30

  scan:
    name: Scan batch ${{ matrix.i }}
    needs: [enumerate]
    if: needs.enumerate.outputs.count != '0'
    runs-on: [self-hosted, Linux, X64, seolith-local, linux-build]
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      # One batch's failure must not cancel the others -- partial coverage
      # with a red job beats no coverage.
      fail-fast: false
      matrix: ${{ fromJSON(needs.enumerate.outputs.matrix) }}
    steps:
      # The dev-standards checkout itself: the canonical .gitleaks.toml for
      # repos without their own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint sweep app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SWEEP_APP_ID }}
          private-key: ${{ secrets.SWEEP_APP_PRIVATE_KEY }}
          owner: seolith-llc
          permission-contents: read

      - name: Install gitleaks (pinned, checksum-verified)
        id: gl
        shell: bash
        run: |
          set -euo pipefail
          # Linux-only: the label set above admits no Windows runner.
          T="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          U="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${T}"
          curl -sSfL -o "$RUNNER_TEMP/$T" "$U"
          echo "${GITLEAKS_SHA256_LINUX}  $RUNNER_TEMP/$T" | sha256sum -c - \
            || { echo "::error::gitleaks checksum mismatch -- refusing to execute the download."; exit 1; }
          tar -xzf "$RUNNER_TEMP/$T" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks" 2>/dev/null || true
          echo "bin=$RUNNER_TEMP/gitleaks" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan repos in this batch
        id: scan
        shell: bash
        env:
          REPOS: ${{ matrix.repos }}
          BATCH_I: ${{ matrix.i }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # Same isolation as the gate: the runner user's gitconfig must not
          # change what gitleaks parses (verdicts differed by runner user).
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set -uo pipefail
          mkdir -p results
          SUMMARY="batch-summary-${BATCH_I}.tsv"
          : > "$SUMMARY"
          failures=0
          for repo in $REPOS; do
            # Repo names come from the API, but the name becomes a path below --
            # refuse anything outside GitHub's own charset before rm -rf sees it.
            case "$repo" in
              *[!A-Za-z0-9._-]*|"") echo "::error::unexpected repo name '$repo'"; failures=$((failures + 1)); continue ;;
            esac
            dir="repos/$repo"
            rm -rf -- "$dir"
            if ! git clone --quiet --filter=blob:none --depth 1 \
                 "https://x-access-token:${GH_TOKEN}@github.com/seolith-llc/${repo}.git" "$dir"; then
              echo "::error::clone failed for $repo"
              printf '%s\tclone-failed\t0\t-\t-\n' "$repo" >> "$SUMMARY"
              failures=$((failures + 1))
              continue
            fi
            # Scan from INSIDE the clone (gitleaks dir .) so report paths are
            # repo-relative -- "maintenance/x.md", not "repos/<repo>/maintenance/x.md".
            # Config and report paths must therefore be absolute before the cd.
            cfg="$dir/.gitleaks.toml"; cfgsrc="repo"
            if [ -f "$cfg" ]; then cfg="$(cd "$dir" && pwd)/.gitleaks.toml"; else cfg="$GITHUB_WORKSPACE/.gitleaks.toml"; cfgsrc="canonical"; fi
            if grep -rlq "secret-scan" "$dir/.github/workflows/" 2>/dev/null; then gate="yes"; else gate="no"; fi
            set +e
            (cd "$dir" && "${{ steps.gl.outputs.bin }}" dir . --config "$cfg" \
              --redact --no-banner --exit-code 2 \
              --report-format json --report-path "$GITHUB_WORKSPACE/results/${repo}.json")
            rc=$?
            set -e
            # Exit-code contract, handled explicitly: 2 = findings (the sweep's
            # OUTPUT, recorded, never a job failure), 0 = clean, anything else
            # = scanner infrastructure error and DOES fail the job below.
            case "$rc" in
              0)
                status="clean"; n=0 ;;
              2)
                status="findings"
                n=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "results/${repo}.json" 2>/dev/null \
                    || python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "results/${repo}.json") ;;
              *)
                status="scan-error"; n=0
                echo "::error::gitleaks failed to run on $repo (exit $rc)"
                failures=$((failures + 1)) ;;
            esac
            printf '%s\t%s\t%s\t%s\t%s\n' "$repo" "$status" "$n" "$cfgsrc" "$gate" >> "$SUMMARY"
            rm -rf -- "$dir"
            echo "[$repo] $status ($n finding(s), config: $cfgsrc, gate: $gate)"
          done
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures repo(s) in this batch hit infrastructure errors (clone or scanner) -- coverage is partial; see the log lines above."
            exit 1
          fi

      - name: Upload batch results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-sweep-batch-${{ matrix.i }}
          path: |
            batch-summary-${{ matrix.i }}.tsv
            results/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Aggregate report
    needs: [enumerate, scan]
    if: always()
    runs-on: [self-hosted, Linux, X64, seolith-local, linux-build]
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Download batch artifacts
        if: needs.scan.result == 'success' || needs.scan.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: secret-sweep-batch-*
          path: batches

      - name: Build report and summary
        if: needs.scan.result == 'success' || needs.scan.result == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' || python - <<'PY'
          import collections, glob, json, os

          rows = []
          for tsv in sorted(glob.glob("batches/*/batch-summary-*.tsv")):
              for line in open(tsv, encoding="utf-8"):
                  parts = line.rstrip("\n").split("\t")
                  if len(parts) >= 5:
                      rows.append(parts[:5])

          findings = []
          for js in sorted(glob.glob("batches/*/results/*.json")):
              repo = os.path.splitext(os.path.basename(js))[0]
              try:
                  data = json.load(open(js, encoding="utf-8"))
              except Exception:
                  continue
              for f in data:
                  # rule + file + line, never the value -- the reports were
                  # produced with --redact and stay that way here.
                  findings.append({"repo": repo, "rule": f.get("RuleID", "?"),
                                   "file": f.get("File", "?"), "line": f.get("StartLine", "?")})

          os.makedirs("report", exist_ok=True)
          with open("report/findings.jsonl", "w", encoding="utf-8") as fh:
              for f in findings:
                  fh.write(json.dumps(f) + "\n")

          def cell(s):
              return str(s).replace("|", "\\|")

          clean = [r for r in rows if r[1] == "clean"]
          withfind = [r for r in rows if r[1] == "findings"]
          errors = [r for r in rows if r[1] not in ("clean", "findings")]
          nogate = sorted(r[0] for r in rows if r[4] == "no")
          canonical = sorted(r[0] for r in rows if r[3] == "canonical")
          byrule = collections.Counter(f["rule"] for f in findings)

          L = []
          L.append("## Org secret sweep")
          L.append("")
          L.append("Findings are REPORTED, not gated. A finding means: rotate the")
          L.append("credential at its source -- deleting the file leaves it in history.")
          L.append("")
          L.append("| metric | count |")
          L.append("| --- | ---: |")
          L.append("| repos scanned | %d |" % len(rows))
          L.append("| clean | %d |" % len(clean))
          L.append("| with findings | %d |" % len(withfind))
          L.append("| infrastructure errors (clone/scanner) | %d |" % len(errors))
          L.append("| total findings | %d |" % len(findings))
          L.append("| repos without the PR gate (drift) | %d |" % len(nogate))
          L.append("| repos on canonical config, no repo-local .gitleaks.toml | %d |" % len(canonical))
          if byrule:
              L.append("")
              L.append("### Findings by rule")
              L.append("")
              for rule, c in byrule.most_common():
                  L.append("- `%s`: %d" % (rule, c))
          if findings:
              L.append("")
              L.append("### Findings (values redacted)")
              L.append("")
              L.append("| repo | rule | location |")
              L.append("| --- | --- | --- |")
              for f in findings[:50]:
                  L.append("| %s | `%s` | %s:%s |" % (cell(f["repo"]), cell(f["rule"]), cell(f["file"]), f["line"]))
              if len(findings) > 50:
                  L.append("")
                  L.append("_%d more in the org-secret-sweep-report artifact (findings.jsonl)._" % (len(findings) - 50))
          if errors:
              L.append("")
              L.append("### Infrastructure errors (coverage gap -- re-run or fix)")
              L.append("")
              for r in errors:
                  L.append("- `%s`: %s" % (r[0], r[1]))
          if nogate:
              L.append("")
              L.append("### Repos without the PR gate (adopt secret-scan.yml)")
              L.append("")
              for r in nogate:
                  L.append("- `%s`" % r)
          with open("report/summary.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(L) + "\n")
          print("repos=%d findings=%d errors=%d" % (len(rows), len(findings), len(errors)))
          PY
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload org report
        if: needs.scan.result == 'success' || needs.scan.result == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: org-secret-sweep-report
          path: report/
          retention-days: 30

      - name: Verdict
        shell: bash
        env:
          ENUM_RESULT: ${{ needs.enumerate.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          set -euo pipefail
          case "$ENUM_RESULT" in
            success) ;;
            *) echo "::error::enumeration job ended as '$ENUM_RESULT' -- the sweep did not cover the org."; exit 1 ;;
          esac
          case "$SCAN_RESULT" in
            success)
              echo "Sweep completed. Findings (if any) are reported in the summary and the org-secret-sweep-report artifact -- they are not a build failure." ;;
            skipped)
              echo "::error::scan job was skipped although enumeration reported repos -- coverage is zero."; exit 1 ;;
            *)
              echo "::error::one or more scan batches failed on infrastructure errors -- coverage is partial; see batch artifacts."; exit 1 ;;
          esac
