name: Reusable Node Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24"
      project-path:
        required: false
        type: string
        default: "."
      install-command:
        required: false
        type: string
        default: "npm ci"
      build-command:
        required: false
        type: string
        default: "npm run build"
      audit-level:
        required: false
        type: string
        default: "high"
      runs-on:
        required: false
        type: string
        # Linux by default since 2026-07-30. The estate's 3 Windows runners
        # were the queue for every build while 3 WSL runners idled --
        # effective capacity was 3 of 7. This lane is pure Node and has no
        # Windows dependency; proven green on Linux in seolith-hindi-buddy#14.
        #
        # 'node-capable', NOT 'linux-build': EWA-NUC-KRK-LINUX carries
        # linux-build but is a WSL 1 host whose Node install does not resolve,
        # so every npx there dies instantly. Callers needing Windows can still
        # override this input.
        default: '["self-hosted","Linux","X64","seolith-local","node-capable"]'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@v5

      - name: Run AgentShield Security Scan
        run: npx --yes ecc-agentshield@1.4.0 scan --path "${{ github.workspace }}" --gate

      - name: Detect project path
        id: detect
        shell: pwsh
        run: |
          $target = "${{ inputs.project-path }}"
          if (-not (Test-Path (Join-Path $target "package.json"))) {
            $found = Get-ChildItem -Recurse -Depth 6 -Filter package.json |
              Where-Object { $_.FullName -notmatch "[\\/]node_modules[\\/]" } |
              Sort-Object @{ Expression = { $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count } }, FullName |
              Select-Object -First 1
            if ($found) { $target = $found.Directory.FullName }
          }
          if (-not (Test-Path (Join-Path $target "package.json"))) { throw "No package.json found for Node build." }
          "path=$target" >> $env:GITHUB_OUTPUT
          echo "Detected Node path: $target"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        shell: pwsh
        run: |
          $install = "${{ inputs.install-command }}"
          if ($install -eq "npm ci" -and -not (Test-Path "package-lock.json")) {
            echo "No package-lock.json found; falling back to npm install."
            npm install
            exit $LASTEXITCODE
          }
          Invoke-Expression $install
        working-directory: ${{ steps.detect.outputs.path }}

      # This step was `continue-on-error: true` until 2026-08-04, which meant
      # the audit gate COULD NOT FAIL. It printed advisories into the log and
      # the job went green regardless.
      #
      # That is worse than having no gate at all. A repo with no audit step is
      # visibly ungated; a repo with a decorative one looks audited. Four repos
      # on this lane were carrying HIGH advisories behind a green badge --
      # seolith-hindi-buddy printed "1 high" in a run on 2026-08-04 and
      # reported success the same second.
      #
      # It also defeats inspection: the jobs API reports a continue-on-error
      # step as conclusion=success even when the command exited non-zero, so
      # the masking is invisible to tooling as well as to people.
      #
      # If a repo genuinely cannot clear its advisories yet, raise ITS
      # audit-level input, with a dated comment saying why. Do not restore this
      # flag -- that re-hides every repo on the lane to unblock one.
      - name: Audit dependencies
        run: npm audit --audit-level=${{ inputs.audit-level }}
        working-directory: ${{ steps.detect.outputs.path }}

      - name: Build
        shell: pwsh
        run: |
          Set-Location "${{ steps.detect.outputs.path }}"
          $build = "${{ inputs.build-command }}"
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($build -eq "npm run build" -and -not $package.scripts.build) {
            # `exit 0` used to sit here unconditionally, AFTER npm test. A repo
            # with no build script and a FAILING test suite got a green check:
            # the tests ran, printed their failures, and the result was thrown
            # away. That is worse than having no tests, because the badge said
            # otherwise. 32 of 72 active repos run CI that never executes a
            # test; this lane was quietly one of them for any repo without a
            # build script.
            if ($package.scripts.test) {
              echo "No build script; running npm test and HONOURING its exit code."
              npm test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else {
              echo "No build script and no test script; nothing to do."
            }
            exit 0
          }
          Invoke-Expression $build

      # M9: run the test suite and HONOUR its exit code.
      #
      # A 2026-07-29 sweep found 53 of 72 active repos whose CI executes no test
      # command at all -- and 11 of those DO have a test suite that CI simply
      # never ran. This lane was a direct cause: it linted and built, and never
      # tested, for every repo that calls it.
      #
      # Absence of a `test` script is not a failure -- many callers are static
      # sites. A test script that FAILS is a failure, and must be, or the green
      # check is a lie. That distinction is the whole point of the rule.
      - name: Test
        timeout-minutes: 15
        shell: pwsh
        working-directory: ${{ steps.detect.outputs.path }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.scripts.test) {
            Write-Host "No 'test' script in package.json; nothing to run."
            exit 0
          }
          if ($pkg.scripts.test -match 'no test specified') {
            Write-Host "package.json has the npm-init placeholder test script; skipping."
            exit 0
          }
          Write-Host "Running: npm test"
          npm test --if-present
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tests failed (exit $LASTEXITCODE)."
            exit $LASTEXITCODE
          }
