name: Reusable .NET Build & Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: "10.0.x"
      project-path:
        required: false
        type: string
        default: "."
      runs-on:
        required: false
        type: string
        default: '["self-hosted","Windows","X64","seolith-local"]'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js for AgentShield
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      
      - name: Run AgentShield Security Scan
        run: npx ecc-agentshield scan --path "${{ github.workspace }}" --gate
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          
      - name: Detect project
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.project-path }}"
          if [[ "$target" == "." ]]; then
            target="$(find . -maxdepth 6 -type f \( -name '*.sln' -o -name '*.slnx' \) -print | sort | head -n 1)"
            if [[ -z "$target" ]]; then
              target="$(find . -maxdepth 6 -type f -name '*.csproj' -print | sort | head -n 1)"
            fi
          fi
          [[ -n "$target" && -f "$target" ]] || { echo "No .NET project or solution found." >&2; exit 1; }
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "Targeting: $target"

      - name: Restore dependencies
        run: dotnet restore "${{ steps.detect.outputs.path }}"

      - name: Build
        run: dotnet build "${{ steps.detect.outputs.path }}" --no-restore

      - name: Test
        timeout-minutes: 10
        run: dotnet test "${{ steps.detect.outputs.path }}" --no-build --verbosity normal
