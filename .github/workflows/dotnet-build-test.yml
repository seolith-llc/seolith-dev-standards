name: Reusable .NET Build & Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: "10.0.x"
      project-path:
        required: false
        type: string
        default: "."

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run AgentShield Security Scan
        run: npx ecc-agentshield scan --gate
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          
      - name: Restore dependencies
        run: dotnet restore ${{ inputs.project-path }}
        
      - name: Build
        run: dotnet build ${{ inputs.project-path }} --no-restore
        
      - name: Test
        run: dotnet test ${{ inputs.project-path }} --no-build --verbosity normal
