name: Reusable .NET Build & Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: "10.0.x"
      project-path:
        required: false
        type: string
        default: "."
      runs-on:
        required: false
        type: string
        default: '["self-hosted","Windows","X64","seolith-local"]'
      test-filter:
        # dotnet test --filter expression. Empty means run everything.
        #
        # WHY THIS EXISTS. Tests that need Docker cannot run on the Windows
        # runner services: they execute as NETWORK SERVICE, which cannot reach
        # Docker Desktop's named pipe, so Testcontainers throws
        # DockerUnavailableException and the whole suite fails. That single
        # cause blocked 9 seolith-portal PRs on 2026-07-30.
        #
        # Excluding those tests is a REAL coverage loss, not a fix -- they must
        # still be run locally before touching the code they cover, and the
        # calling repo's CLAUDE.md should say so. The durable fix is to give a
        # Docker-capable runner a .NET SDK (the WSL runners have Docker but no
        # dotnet) and run integration tests there.
        required: false
        type: string
        default: ""
    secrets:
      packages-read-token:
        # WHY THIS EXISTS. GITHUB_TOKEN is scoped to the calling repo, and
        # GitHub's NuGet registry inherits the PUBLISHING repo's permissions --
        # so a consumer repo's token gets 403 on Seolith.Platform.* (proven:
        # seolith-ortho run 30509431979, 2026-07-30). There is no OIDC path to
        # the NuGet feed. The accepted mechanism is a read:packages-only
        # classic PAT on the machine account, stored as the org secret
        # PACKAGES_READ_TOKEN with 'selected' visibility (consumer repos only).
        # Optional: repos without the secret fall back to GITHUB_TOKEN, which
        # still works for same-repo packages.
        required: false

permissions:
  contents: read
  packages: read # resolve Seolith.Platform.* from GitHub Packages

jobs:
  build-and-test:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js for AgentShield
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      
      - name: Run AgentShield Security Scan
        run: npx --yes ecc-agentshield@1.4.0 scan --path "${{ github.workspace }}" --gate
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          
      - name: Detect project
        id: detect
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "${{ inputs.project-path }}"

          if ($target -eq ".") {
            $target = Get-ChildItem -Path . -Recurse -Depth 6 -File |
              Where-Object { $_.Extension -in @(".sln", ".slnx") } |
              Sort-Object FullName |
              Select-Object -First 1 -ExpandProperty FullName

            if ([string]::IsNullOrWhiteSpace($target)) {
              $target = Get-ChildItem -Path . -Recurse -Depth 6 -File -Filter "*.csproj" |
                Sort-Object FullName |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }

          if ([string]::IsNullOrWhiteSpace($target) -or -not (Test-Path -LiteralPath $target -PathType Leaf)) {
            throw "No .NET project or solution found."
          }

          $target = (Resolve-Path -LiteralPath $target -Relative) -replace "^\.\\", ""
          "path=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Targeting: $target"

      # Authenticate the GitHub Packages feed before restore.
      #
      # seolith-platform publishes 14 Seolith.Platform.* libraries there. Repos
      # that consume them cannot restore without credentials, and until
      # 2026-07-29 three of them (ortho, sportmed, domain-suite) worked around
      # that with ProjectReference to a sibling checkout -- which does not exist
      # in CI, so their builds failed. ortho had been red since 2026-06-08.
      #
      # Runs only when a nuget.config actually declares the feed, so repos that
      # do not consume the libraries are unaffected.
      - name: Authenticate GitHub Packages
        shell: bash
        env:
          # Bound via env, never interpolated into the script body. Fallback
          # chain: cross-repo PAT if the caller passes one, else GITHUB_TOKEN.
          NUGET_USER: ${{ github.actor }}
          NUGET_PASSWORD: ${{ secrets.packages-read-token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CFG=$(find . -maxdepth 3 -iname "nuget.config" -not -path "*/node_modules/*" | head -1)
          if [ -z "$CFG" ] || ! grep -q "nuget.pkg.github.com" "$CFG"; then
            echo "no GitHub Packages source declared; skipping"; exit 0
          fi
          echo "configuring credentials for the github source in $CFG"
          dotnet nuget update source github               --username "$NUGET_USER" --password "$NUGET_PASSWORD"               --store-password-in-clear-text --configfile "$CFG" 2>/dev/null             || dotnet nuget add source "https://nuget.pkg.github.com/seolith-llc/index.json"               --name github               --username "$NUGET_USER" --password "$NUGET_PASSWORD"               --store-password-in-clear-text --configfile "$CFG"

      - name: Restore dependencies
        run: dotnet restore "${{ steps.detect.outputs.path }}"

      - name: Build
        run: dotnet build "${{ steps.detect.outputs.path }}" --no-restore

      - name: Test
        timeout-minutes: 10
        shell: bash
        env:
          TEST_PATH: ${{ steps.detect.outputs.path }}
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -euo pipefail
          if [ -n "$TEST_FILTER" ]; then
            echo "::notice::Running with --filter '$TEST_FILTER' -- excluded tests are NOT covered by CI"
            dotnet test "$TEST_PATH" --no-build --verbosity normal --filter "$TEST_FILTER"
          else
            dotnet test "$TEST_PATH" --no-build --verbosity normal
          fi
