name: Reusable .NET Build & Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: "10.0.x"
      project-path:
        required: false
        type: string
        default: "."
      runs-on:
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      
      - name: Run AgentShield Security Scan
        run: npx ecc-agentshield scan --gate
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          
      - name: Restore dependencies
        shell: bash
        run: |
          TARGET="${{ inputs.project-path }}"
          if [ "$TARGET" == "." ]; then
            # Find .sln, then .slnx, then .csproj, sort by depth (slash count)
            FOUND=$(find . -maxdepth 6 \( -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \) | awk -F/ '{ print NF, $0 }' | sort -k1,1n -k2,2 | awk '{print $2}' | head -n 1)
            # Prioritize SLN if multiple results at same depth
            SLN=$(find . -maxdepth 6 \( -name "*.sln" -o -name "*.slnx" \) | awk -F/ '{ print NF, $0 }' | sort -k1,1n | awk '{print $2}' | head -n 1)
            if [ ! -z "$SLN" ]; then
              FOUND="$SLN"
            fi
            if [ ! -z "$FOUND" ]; then
              TARGET="$FOUND"
            fi
          fi
          echo "Targeting: $TARGET"
          dotnet restore "$TARGET"
        
      - name: Build
        shell: bash
        run: |
          TARGET="${{ inputs.project-path }}"
          if [ "$TARGET" == "." ]; then
            # Find .sln, then .slnx, then .csproj, sort by depth (slash count)
            FOUND=$(find . -maxdepth 6 \( -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \) | awk -F/ '{ print NF, $0 }' | sort -k1,1n -k2,2 | awk '{print $2}' | head -n 1)
            # Prioritize SLN if multiple results at same depth
            SLN=$(find . -maxdepth 6 \( -name "*.sln" -o -name "*.slnx" \) | awk -F/ '{ print NF, $0 }' | sort -k1,1n | awk '{print $2}' | head -n 1)
            if [ ! -z "$SLN" ]; then
              FOUND="$SLN"
            fi
            if [ ! -z "$FOUND" ]; then
              TARGET="$FOUND"
            fi
          fi
          dotnet build "$TARGET" --no-restore
        
      - name: Test
        shell: bash
        run: |
          TARGET="${{ inputs.project-path }}"
          if [ "$TARGET" == "." ]; then
            # Find .sln, then .slnx, then .csproj, sort by depth (slash count)
            FOUND=$(find . -maxdepth 6 \( -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \) | awk -F/ '{ print NF, $0 }' | sort -k1,1n -k2,2 | awk '{print $2}' | head -n 1)
            # Prioritize SLN if multiple results at same depth
            SLN=$(find . -maxdepth 6 \( -name "*.sln" -o -name "*.slnx" \) | awk -F/ '{ print NF, $0 }' | sort -k1,1n | awk '{print $2}' | head -n 1)
            if [ ! -z "$SLN" ]; then
              FOUND="$SLN"
            fi
            if [ ! -z "$FOUND" ]; then
              TARGET="$FOUND"
            fi
          fi
          dotnet test "$TARGET" --no-build --verbosity normal
