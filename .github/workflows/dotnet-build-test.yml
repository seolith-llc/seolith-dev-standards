name: Reusable .NET Build & Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: "10.0.x"
      project-path:
        required: false
        type: string
        default: "."
      runs-on:
        required: false
        type: string
        default: '["self-hosted","Windows","X64"]'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      
      - name: Run AgentShield Security Scan
        run: npx ecc-agentshield scan --gate
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          
      - name: Restore dependencies
        shell: pwsh
        run: |
          $TARGET = "${{ inputs.project-path }}"
          if ($TARGET -eq ".") {
            $FOUND = Get-ChildItem -Recurse -Depth 6 -Include *.sln,*.slnx,*.csproj |
              Sort-Object @{ Expression = { $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count } }, FullName |
              Select-Object -First 1
            $SLN = Get-ChildItem -Recurse -Depth 6 -Include *.sln,*.slnx |
              Sort-Object @{ Expression = { $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count } }, FullName |
              Select-Object -First 1
            if ($SLN) { $FOUND = $SLN }
            if ($FOUND) { $TARGET = $FOUND.FullName }
          }
          echo "Targeting: $TARGET"
          dotnet restore "$TARGET"
        
      - name: Build
        shell: pwsh
        run: |
          $TARGET = "${{ inputs.project-path }}"
          if ($TARGET -eq ".") {
            $FOUND = Get-ChildItem -Recurse -Depth 6 -Include *.sln,*.slnx,*.csproj |
              Sort-Object @{ Expression = { $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count } }, FullName |
              Select-Object -First 1
            $SLN = Get-ChildItem -Recurse -Depth 6 -Include *.sln,*.slnx |
              Sort-Object @{ Expression = { $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count } }, FullName |
              Select-Object -First 1
            if ($SLN) { $FOUND = $SLN }
            if ($FOUND) { $TARGET = $FOUND.FullName }
          }
          dotnet build "$TARGET" --no-restore
        
      - name: Test
        timeout-minutes: 10
        shell: pwsh
        run: |
          $TARGET = "${{ inputs.project-path }}"
          if ($TARGET -eq ".") {
            $FOUND = Get-ChildItem -Recurse -Depth 6 -Include *.sln,*.slnx,*.csproj |
              Sort-Object @{ Expression = { $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count } }, FullName |
              Select-Object -First 1
            $SLN = Get-ChildItem -Recurse -Depth 6 -Include *.sln,*.slnx |
              Sort-Object @{ Expression = { $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count } }, FullName |
              Select-Object -First 1
            if ($SLN) { $FOUND = $SLN }
            if ($FOUND) { $TARGET = $FOUND.FullName }
          }
          dotnet test "$TARGET" --no-build --verbosity normal
