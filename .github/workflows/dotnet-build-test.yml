name: Reusable .NET Build & Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: "10.0.x"
      project-path:
        required: false
        type: string
        default: "."

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Run AgentShield Security Scan
        run: npx ecc-agentshield scan --gate
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          
      - name: Restore dependencies
        run: |
          TARGET="${{ inputs.project-path }}"
          if [ "$TARGET" == "." ]; then
            FOUND=$(find . -maxdepth 6 \( -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \) | head -n 1)
            if [ ! -z "$FOUND" ]; then
              TARGET="$FOUND"
            fi
          fi
          echo "Targeting: $TARGET"
          dotnet restore "$TARGET"
        
      - name: Build
        run: |
          TARGET="${{ inputs.project-path }}"
          if [ "$TARGET" == "." ]; then
            FOUND=$(find . -maxdepth 6 \( -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \) | head -n 1)
            if [ ! -z "$FOUND" ]; then
              TARGET="$FOUND"
            fi
          fi
          dotnet build "$TARGET" --no-restore
        
      - name: Test
        run: |
          TARGET="${{ inputs.project-path }}"
          if [ "$TARGET" == "." ]; then
            FOUND=$(find . -maxdepth 6 \( -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \) | head -n 1)
            if [ ! -z "$FOUND" ]; then
              TARGET="$FOUND"
            fi
          fi
          dotnet test "$TARGET" --no-build --verbosity normal
