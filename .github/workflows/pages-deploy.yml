name: Deploy to Cloudflare Pages

# Reusable deploy lane: build a static/PWA frontend and publish it to
# Cloudflare Pages. Pages is free (unlimited bandwidth, global CDN), which is
# why the estate is moving static frontends OFF EC2+nginx -- see
# docs/HOSTING_CONSOLIDATION.md.
#
# WHY THIS EXISTS. The 2026-08-19 hosting audit found every frontend served
# from self-hosted EC2 behind nginx -- including purely static PWAs and
# marketing sites that cost instance-hours for no reason. Pages hosts those
# for $0. The lane auto-creates the Pages project when missing (wrangler v4
# `pages deploy` refuses to). Custom domains are a separate, deliberate DNS
# step (documented in HOSTING_CONSOLIDATION.md).
#
# SECRETS. Callers must pass cloudflare-account-id and cloudflare-api-token.
# The token needs only "Pages: Edit" on the account -- do not reuse a
# broader token. Estate default: the CLOUDFLARE_PAGES_* org secrets.
# packages-read-token is OPTIONAL: pass it only for repos whose lockfile pulls
# @seolith-llc/* from GitHub Packages (estate default: PACKAGES_READ_TOKEN).
#
# SUPPLY CHAIN. Third-party ACTIONS are pinned by SHA and wrangler itself is
# npx-pinned to an exact version (npm versions are immutable): this lane runs
# with a live Cloudflare credential, so a mutable tag is a supply-chain hole.

on:
  workflow_call:
    inputs:
      app-path:
        description: Directory of the frontend app (where package.json lives).
        required: false
        type: string
        default: "."
      output-dir:
        description: Build output dir relative to app-path (dist for Vite/Astro).
        required: false
        type: string
        default: "dist"
      project-name:
        description: Cloudflare Pages project name (auto-created on first deploy).
        required: true
        type: string
      package-manager:
        description: npm | pnpm
        required: false
        type: string
        default: "npm"
      runs-on:
        required: false
        type: string
        default: '["self-hosted","Linux","X64","seolith-local","linux-build"]'
    secrets:
      cloudflare-account-id:
        required: true
      cloudflare-api-token:
        required: true
      packages-read-token:
        description: read:packages token for @seolith-llc/* on GitHub Packages; only needed when the lockfile references it.
        required: false

permissions:
  contents: read

jobs:
  # M6: runs-on is resolved before any step of the work job runs, so it
  # cannot be validated from inside that job. This job runs on a fixed,
  # non-caller-controlled label first and rejects any runs-on value not
  # already proven safe -- closing "caller picks the machine" without
  # changing behavior for any existing caller. Allow-list built from every
  # runs-on override actually in use estate-wide as of 2026-09-06; add a new
  # entry here deliberately if a new pool genuinely needs one.
  resolve-runner:
    # Linux pool only: unfiltered [self-hosted] can land on the Windows
    # self-hosted runner (no WSL distro), where `shell: bash` fails instantly.
    # The work job still runs on the caller-requested labels via the output
    # below, so this does not constrain any lane to Linux.
    # seolith-local keeps this job off prod-01-refrilog: that runner sits on the
    # production host, carries self-hosted/Linux/X64, and is not a build pool.
    runs-on: [self-hosted, Linux, X64, seolith-local]
    permissions: {}
    outputs:
      runs-on: ${{ steps.validate.outputs.runs-on }}
      package-manager: ${{ steps.validate.outputs.package-manager }}
    steps:
      - name: Validate requested runner label set
        id: validate
        shell: bash
        env:
          REQUESTED: ${{ inputs.runs-on }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$REQUESTED" in
            '["self-hosted","Linux","X64","seolith-local","linux-build"]'|'["self-hosted", "Linux", "seolith-local", "always-on"]')
              ;;
            *)
              echo "::error::runs-on input '$REQUESTED' is not an approved label set for this workflow. A caller cannot redirect this job to an arbitrary runner -- add the new label set here deliberately if a new pool genuinely needs it."
              exit 1
              ;;
          esac
          case "$PACKAGE_MANAGER" in
            npm|pnpm) ;;
            *)
              echo "::error::package-manager must be npm or pnpm."
              exit 1
              ;;
          esac
          printf 'runs-on=%s\n' "$REQUESTED" >> "$GITHUB_OUTPUT"
          printf 'package-manager=%s\n' "$PACKAGE_MANAGER" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [resolve-runner]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Order matters: setup-node FIRST (package-manager-cache off, so it never
      # shells out to pnpm), then corepack from the freshly installed Linux
      # node. The seolith-local WSL runners have no Linux node of their own --
      # without this, pnpm/action-setup's npm installer falls through WSL
      # interop to the WINDOWS npm and dies on UNC paths.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm via corepack (uses the repo's packageManager pin)
        if: needs.resolve-runner.outputs.package-manager == 'pnpm'
        run: corepack enable pnpm

      # GitHub Packages auth for repos consuming @seolith-llc/* (secrets cannot
      # be referenced in `if`, hence the env hop).
      - name: Authenticate to GitHub Packages
        if: env.PACKAGES_READ_TOKEN != ''
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.packages-read-token }}
        run: echo "//npm.pkg.github.com/:_authToken=${PACKAGES_READ_TOKEN}" >> "$HOME/.npmrc"

      - name: Install and build
        working-directory: ${{ inputs.app-path }}
        env:
          PACKAGE_MANAGER: ${{ needs.resolve-runner.outputs.package-manager }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm install --frozen-lockfile
            pnpm build
          else
            npm ci
            npm run build
          fi

      # wrangler v4 `pages deploy` fails if the project does not exist yet.
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
          PROJECT_NAME: ${{ inputs.project-name }}
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4 pages project list 2>/dev/null | grep -qF "$PROJECT_NAME"; then
            npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main
          fi

      # Plain npx instead of cloudflare/wrangler-action: in pnpm workspaces the
      # action tries to `pnpm add wrangler` at the root, which pnpm 11 refuses.
      # npx with an EXACT version keeps the supply-chain pin (npm versions are
      # immutable) while behaving identically for npm and pnpm repos.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
          APP_PATH: ${{ inputs.app-path }}
          OUTPUT_DIR: ${{ inputs.output-dir }}
          PROJECT_NAME: ${{ inputs.project-name }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 pages deploy "$APP_PATH/$OUTPUT_DIR" --project-name="$PROJECT_NAME"
