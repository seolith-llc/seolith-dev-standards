name: Secret scan

# Reusable gitleaks gate. Called by every repo; fails the build on a detected secret.
#
# WHY THIS EXISTS. A 2026-07-28 audit of all 72 active repositories found 70 with
# no secret-scanning gate at all, and real credentials committed for months:
#
#   seolith-apps-showcase  two OpenSSH PRIVATE keys + a GitHub PAT, since 2026-03-11
#   seolith-twbb           a host sudo password, hardcoded 10 times
#
# GitHub's push protection caught neither -- file-based credentials are not
# recognised token patterns.
#
# WHY THE BINARY AND NOT gitleaks/gitleaks-action.
# The action requires a PAID licence for organisations: it fails with
# "missing gitleaks license ... store it as a GitHub Secret named
# GITLEAKS_LICENSE". Verified 2026-07-29 on pto-admin PR #51. The gitleaks
# SCANNER is MIT-licensed and free; only the Action wrapper is commercial.
# Running the binary directly costs nothing, and removes a third-party action
# from a NON-EPHEMERAL runner that also holds production OIDC credentials.
#
# The download is pinned by version AND verified by sha256 before execution --
# no `curl | sh`. Bumping the version means changing both, deliberately.
#
# SCOPE. This gates commits. It does not clean history and does not revoke
# anything already leaked: a committed secret is compromised the moment it is
# pushed, and only revocation at the source fixes that.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label set. Self-hosted by default -- the org's included Actions
          minutes are spent and the spending limit is $0, so a GitHub-hosted
          default fails before starting. That mistake left seolith-teselith red
          for 31 consecutive runs.

          Targets `linux-build`, NOT `always-on`. Both online Linux runners carry
          linux-build; only EWA-NUC-KRK-LINUX carries always-on. Requiring
          always-on serialised the entire estate rollout onto one machine -- 26
          scans queued behind a single runner on 2026-07-29 while
          LKS-LLC-DESKTOP-WSL (24 CPU, 62 GiB) sat idle. A secret scan is
          stateless and touches no host, so it has no reason to demand the
          always-on box.
        required: false
        type: string
        default: '["self-hosted","Linux","X64","seolith-local","linux-build"]'
      config-path:
        description: "Path to .gitleaks.toml. Empty or missing uses gitleaks' default ruleset."
        required: false
        type: string
        default: ".gitleaks.toml"
      scan-history:
        description: >-
          true scans FULL git history -- correct for first adoption, because it
          surfaces what is already committed. false scans only the working tree
          and is faster once a repo is known clean.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # Per-platform checksums. The installer previously downloaded the linux_x64
  # tarball unconditionally, so every caller routed to the Windows pool failed
  # at "tar: Child returned status 128" -- 45 of 69 rollout PRs, all of them
  # install failures rather than real findings.
  GITLEAKS_SHA256_LINUX: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GITLEAKS_SHA256_WINDOWS: "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"

jobs:
  # M6: runs-on is resolved before any step of the work job runs, so it
  # cannot be validated from inside that job. This job runs on a fixed,
  # non-caller-controlled label first and rejects any runs-on value not
  # already proven safe -- closing "caller picks the machine" without
  # changing behavior for any existing caller. Allow-list built from every
  # runs-on override actually in use estate-wide as of 2026-09-06; add a new
  # entry here deliberately if a new pool genuinely needs one.
  resolve-runner:
    runs-on: [self-hosted]
    permissions: {}
    outputs:
      runs-on: ${{ steps.validate.outputs.runs-on }}
    steps:
      - name: Validate requested runner label set
        id: validate
        shell: bash
        env:
          REQUESTED: ${{ inputs.runs-on }}
        run: |
          set -euo pipefail
          case "$REQUESTED" in
            '["self-hosted","Linux","X64","seolith-local","linux-build"]'|'["self-hosted","Linux","X64","seolith-local","always-on"]')
              ;;
            *)
              echo "::error::runs-on input '$REQUESTED' is not an approved label set for this workflow. A caller cannot redirect this job to an arbitrary runner -- add the new label set here deliberately if a new pool genuinely needs it."
              exit 1
              ;;
          esac
          printf 'runs-on=%s\n' "$REQUESTED" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: gitleaks
    needs: [resolve-runner]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Quoted STRINGS, not bare integers. `inputs.scan-history && 0 || 1`
          # looks like a ternary and is not one: GitHub evaluates `true && 0` to
          # 0, which is FALSY, so `0 || 1` returns 1 -- the scan silently ran at
          # depth 1 while reporting scan-history: true. Verified on pto-admin run
          # 30417002179. '0' and '1' are truthy strings and behave as intended.
          fetch-depth: ${{ inputs.scan-history && '0' || '1' }}

      - name: Install gitleaks (pinned, checksum-verified)
        id: gl
        shell: bash
        run: |
          set -euo pipefail
          # RUNNER_OS is set by the runner itself, so this works on both pools
          # without the caller having to know which binary it needs.
          if [ "$RUNNER_OS" = "Windows" ]; then
            T="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"; SUM="$GITLEAKS_SHA256_WINDOWS"; BIN="gitleaks.exe"
          else
            T="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"; SUM="$GITLEAKS_SHA256_LINUX"; BIN="gitleaks"
          fi
          U="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${T}"
          curl -sSfL -o "$RUNNER_TEMP/$T" "$U"
          echo "${SUM}  $RUNNER_TEMP/$T" | sha256sum -c - \
            || { echo "::error::gitleaks checksum mismatch -- refusing to execute the download."; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            unzip -o -q "$RUNNER_TEMP/$T" -d "$RUNNER_TEMP" "$BIN"
          else
            tar -xzf "$RUNNER_TEMP/$T" -C "$RUNNER_TEMP" "$BIN"
          fi
          chmod +x "$RUNNER_TEMP/$BIN" 2>/dev/null || true
          echo "bin=$RUNNER_TEMP/$BIN" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/$BIN" version

      - name: Scan
        id: scan
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          SCAN_HISTORY: ${{ inputs.scan-history }}
        run: |
          set -uo pipefail
          # Inputs bound through env, never interpolated into the shell -- the
          # rule that closed a command-injection hole in deploy-staging.yml.
          ARGS=""
          if [ -n "$CONFIG_PATH" ] && [ -f "$CONFIG_PATH" ]; then
            ARGS="--config $CONFIG_PATH"; echo "config: $CONFIG_PATH"
          else
            echo "config: gitleaks default ruleset"
          fi
          if [ "$SCAN_HISTORY" = "true" ]; then MODE="git"; echo "mode: full history"
          else MODE="dir"; echo "mode: working tree"; fi

          set +e
          "${{ steps.gl.outputs.bin }}" "$MODE" . $ARGS \
            --redact --no-banner --exit-code 2 \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif"
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          # --redact means findings print WITHOUT the secret value, so the build
          # log never becomes a second copy of the leak.
          if [ "$RC" -eq 2 ]; then
            echo "::error::gitleaks found secrets. Rotate them at the source -- deleting the file leaves them in history."
            exit 1
          elif [ "$RC" -ne 0 ]; then
            echo "::error::gitleaks failed to run (exit $RC)."; exit "$RC"
          fi
          echo "No secrets detected."

      # Report WHERE, never WHAT. The scan prints only a count, which tells a
      # maintainer they have a problem and nothing about how to fix it. This
      # reads the SARIF for rule + file + line. Values stay redacted -- the
      # build log must never become a second copy of the leak.
      - name: Report finding locations
        if: always() && steps.scan.outputs.rc == '2'
        shell: bash
        run: |
          R="$RUNNER_TEMP/gitleaks.sarif"
          [ -f "$R" ] || { echo "no SARIF produced"; exit 0; }
          python3 - "$R" <<'PY' || python - "$R" <<'PY'
          import json,sys,collections
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=[]
          for run in d.get("runs",[]):
              for r in run.get("results",[]):
                  rule=r.get("ruleId","?")
                  for loc in r.get("locations",[]):
                      pl=loc.get("physicalLocation",{})
                      f=pl.get("artifactLocation",{}).get("uri","?")
                      ln=pl.get("region",{}).get("startLine","?")
                      rows.append((rule,f,ln))
          print(f"{len(rows)} finding(s) -- values redacted:")
          for rule,f,ln in rows[:40]:
              print(f"  [{rule}] {f}:{ln}")
          c=collections.Counter(r for r,_,_ in rows)
          print("by rule:", dict(c))
          PY

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            if [ "${{ steps.scan.outputs.rc }}" = "0" ]; then
              echo "### Secret scan passed"
            else
              echo "### Secret scan FAILED"
              echo ""
              echo "**Deleting the file is not the fix.** It stays in git history and in"
              echo "every existing clone. Revoke the credential at its source first:"
              echo "rotate the key/token, then optionally rewrite history."
              echo ""
              echo "Genuine false positive? Add a narrow entry to \`.gitleaks.toml\`."
              echo "Keep that allowlist short -- it is a debt ledger, not a settings file."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
