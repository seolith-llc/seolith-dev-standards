name: Secret scan

# Reusable gitleaks gate. Called by every repo; fails the build on a NEW secret.
#
# WHY THIS EXISTS, SPECIFICALLY. A 2026-07-28 audit of all 72 active repositories
# found 70 of them with no secret-scanning gate at all, and found real committed
# credentials that had been sitting in history for months:
#
#   seolith-apps-showcase  two OpenSSH PRIVATE keys + a GitHub PAT, since 2026-03-11
#   seolith-twbb           a host sudo password, hardcoded 10 times
#
# GitHub's own push protection did not stop either, because file-based credentials
# are not recognised token patterns. This closes that gap.
#
# SCOPE, HONESTLY STATED. This gates NEW commits. It does not clean history, and
# it does not revoke anything already leaked -- a committed secret is compromised
# the moment it is pushed, and only revocation at the source fixes that.
#
# RUNNER. Self-hosted by default. The org's 3,000 included Actions minutes are
# spent and the spending limit is $0, so a GitHub-hosted default would fail
# before starting -- that exact mistake left seolith-teselith red for 31 runs.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label set. Defaults to the always-on Linux pool. Windows-only
          repos should pass '["self-hosted","Windows","X64","seolith-local"]'.
        required: false
        type: string
        default: '["self-hosted","Linux","X64","seolith-local","always-on"]'
      config-path:
        description: "Path to .gitleaks.toml. Empty uses gitleaks' default ruleset."
        required: false
        type: string
        default: ".gitleaks.toml"
      fetch-depth:
        description: >-
          0 scans full history and is the correct value for a first adoption --
          it surfaces what is already committed. Switch to 1 afterwards to gate
          only new commits and keep the job fast.
        required: false
        type: number
        default: 0

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Resolve config
        id: cfg
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          set -euo pipefail
          # Input bound through env, never interpolated into the shell -- the
          # same rule that fixed a command-injection hole in deploy-staging.yml.
          if [ -n "$CONFIG_PATH" ] && [ -f "$CONFIG_PATH" ]; then
            echo "path=$CONFIG_PATH" >> "$GITHUB_OUTPUT"
            echo "Using repo config: $CONFIG_PATH"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No $CONFIG_PATH found; using gitleaks' default ruleset."
          fi

      # Pinned to a SHA, not @v2. This job runs on a NON-EPHEMERAL self-hosted
      # runner shared with jobs holding production OIDC credentials, so a
      # poisoned upstream release would execute beside them.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_CONFIG: ${{ steps.cfg.outputs.path }}

      - name: Result
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "No secrets detected."
          else
            {
              echo "### Secret scan failed"
              echo ""
              echo "A secret was detected. **Deleting the file is not the fix** --"
              echo "it stays in history and in every clone. Revoke it at the source:"
              echo "rotate the credential, then remove the commit if you wish."
              echo ""
              echo "False positive? Add a narrow entry to \`.gitleaks.toml\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
