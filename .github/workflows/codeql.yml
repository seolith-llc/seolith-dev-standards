name: CodeQL analysis

# Reusable CodeQL SAST gate. Called by every repo; uploads findings to the
# repo's Security tab and fails PR checks on new alerts.
#
# WHY THIS EXISTS. A 2026-08-19 estate audit found ZERO static analysis
# anywhere in the org: 96 repos, no CodeQL, no Semgrep, nothing. Secret
# scanning (secret-scan.yml) catches committed credentials; it does not catch
# the injection, path-traversal, and XSS classes that only dataflow analysis
# sees. CodeQL is free for the org's repos and requires no licence, so the
# only thing that was missing was a callable workflow.
#
# SCOPE -- INTERPRETED LANGUAGES ONLY, BY DEFAULT. The default `languages`
# input is `javascript-typescript`, which (like python, go, ruby) is analysed
# WITHOUT a build: codeql-action checks out the source and extracts it.
#
# C# IS DIFFERENT. C# requires a successful build (or build-mode: none with
# known limitations) to extract, so a .NET caller MUST pass `languages: csharp`
# AND, where build-mode: none produces poor results, add restore/build steps
# between init and analyze in a repo-local workflow instead of calling this
# one. Do not force every caller to carry .NET build machinery for the sake
# of the repos that need it.
#
# PINNING. codeql-action is pinned by full-length SHA, not a mutable tag --
# this workflow runs with security-events: write on every calling repo, and a
# hijacked tag would inherit that permission across the estate. Bumping the
# version means changing both SHAs below, deliberately.

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          Comma-separated CodeQL languages. Default javascript-typescript.
          Use python, go, ruby, etc. as the repo's stack demands. For csharp,
          read the header: .NET repos likely need a repo-local workflow with
          build steps instead.
        required: false
        type: string
        default: "javascript-typescript"
      runs-on:
        description: >-
          Runner label set. Self-hosted by default -- the org's included Actions
          minutes are spent and the spending limit is $0, so a GitHub-hosted
          default fails before starting.
        required: false
        type: string
        default: '["self-hosted","Linux","X64","seolith-local","linux-build"]'

permissions:
  contents: read

jobs:
  codeql:
    name: codeql (${{ inputs.languages }})
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    permissions:
      # security-events: write is required to upload SARIF to the Security
      # tab. actions: read lets codeql-action download API caches of prior
      # analyses. Neither grants anything beyond this job.
      security-events: write
      actions: read
      contents: read
    steps:
      # WHY THIS GUARD. Code scanning on PRIVATE repos requires GitHub Code
      # Security (the paid GHAS successor). Without it the analyze step 403s
      # ("Code Security must be enabled"), which made every estate caller red
      # on 2026-08-21. The guard probes the code-scanning API first: when Code
      # Security is off, the job passes with a skip notice instead of failing.
      # Enable Code Security on a repo and CodeQL runs for real, unchanged.
      # curl, not gh: gh is not installed on the self-hosted runners.
      - name: Check Code Security availability
        id: guard
        env:
          GH_TOKEN_CURL: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cs-probe.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN_CURL" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/code-scanning/analyses?per_page=1")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -q "Code Security must be enabled" /tmp/cs-probe.json; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Code Security not enabled for this private repo; CodeQL skipped. See codeql.yml header."
          else
            echo "::error::code-scanning probe failed (HTTP $code): $(head -c 200 /tmp/cs-probe.json)"
            exit 1
          fi

      - name: Checkout calling repo
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        if: steps.guard.outputs.enabled == 'true'
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ inputs.languages }}

      - name: Analyze
        if: steps.guard.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
